<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360">
  <defs>
    <style>
      @keyframes vtableFlow { 0%{stroke-dashoffset:80} 100%{stroke-dashoffset:0} }
      @keyframes boxPulse   { 0%,100%{stroke-opacity:.4} 50%{stroke-opacity:1} }
    </style>
    <marker id="mUML" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#38bdf8"/></marker>
    <marker id="mInh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 0,8 7,4" fill="none" stroke="#22d3ee" stroke-width="1.2"/></marker>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="derivedGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0c233c"/></linearGradient>
  </defs>

  <rect width="860" height="360" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    ⚙️ C++17 OOP ENGINE ARCHITECTURE: 7 PARADIGMS &amp; SIMD ZERO-COPY MEMORY PIPELINE
  </text>

  <!-- Class 1: Abstract Base Processor (Abstraction & Polymorphism) -->
  <g transform="translate(30, 45)" font-family="monospace">
    <rect width="240" height="135" rx="8" fill="url(#baseGrad)" stroke="#22d3ee" stroke-width="1.4" style="animation:boxPulse 3s infinite"/>
    <rect width="240" height="24" rx="8" fill="#1e3a5f"/>
    <text x="120" y="16" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="bold">&lt;&lt;interface&gt;&gt; ITileProcessor</text>

    <!-- Attributes -->
    <text x="12" y="38" fill="#94a3b8" font-size="7.8">- tile_id_ : uint32_t</text>
    <text x="12" y="50" fill="#94a3b8" font-size="7.8">- is_initialized_ : bool [Encapsulation]</text>

    <line x1="0" y1="58" x2="240" y2="58" stroke="#334155"/>

    <!-- Virtual Methods -->
    <text x="12" y="72" fill="#38bdf8" font-size="7.8">+ virtual ~ITileProcessor() = default [RAII]</text>
    <text x="12" y="86" fill="#38bdf8" font-size="7.8">+ virtual void processTile(...) = 0</text>
    <text x="12" y="100" fill="#38bdf8" font-size="7.8">+ virtual TileMetrics getMetrics() const = 0</text>
    <text x="12" y="118" fill="#22d3ee" font-size="7.5" font-weight="bold">★ Pure Virtual Abstraction &amp; VTable</text>
  </g>

  <!-- Class 2: Template RasterBuffer<T> (Templates & Operator Overloading) -->
  <g transform="translate(310, 45)" font-family="monospace">
    <rect width="240" height="135" rx="8" fill="url(#baseGrad)" stroke="#818cf8" stroke-width="1.4" style="animation:boxPulse 3s infinite;animation-delay:.5s"/>
    <rect width="240" height="24" rx="8" fill="#2e1065"/>
    <text x="120" y="16" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="bold">template&lt;typename T&gt; RasterBuffer</text>

    <text x="12" y="38" fill="#94a3b8" font-size="7.8">- data_ : std::unique_ptr&lt;T[]&gt; [RAII]</text>
    <text x="12" y="50" fill="#94a3b8" font-size="7.8">- width_, height_, bands_ : size_t</text>

    <line x1="0" y1="58" x2="240" y2="58" stroke="#334155"/>

    <text x="12" y="72" fill="#a78bfa" font-size="7.8">+ T&amp; operator()(size_t r, size_t c, size_t b)</text>
    <text x="12" y="86" fill="#a78bfa" font-size="7.8">+ RasterBuffer operator+(const RasterBuffer&amp;)</text>
    <text x="12" y="100" fill="#a78bfa" font-size="7.8">+ RasterBuffer computeNDVI(...) [SIMD AVX2]</text>
    <text x="12" y="118" fill="#818cf8" font-size="7.5" font-weight="bold">★ Operator Overload &amp; Generic Programming</text>
  </g>

  <!-- Class 3: TileManager Singleton (RAII & Zero-Copy Pipeline) -->
  <g transform="translate(590, 45)" font-family="monospace">
    <rect width="240" height="135" rx="8" fill="url(#baseGrad)" stroke="#34d399" stroke-width="1.4" style="animation:boxPulse 3s infinite;animation-delay:1s"/>
    <rect width="240" height="24" rx="8" fill="#064e3b"/>
    <text x="120" y="16" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">TileManager [Zero-Copy Engine]</text>

    <text x="12" y="38" fill="#94a3b8" font-size="7.8">- memory_pool_ : AlignedMemoryPool</text>
    <text x="12" y="50" fill="#94a3b8" font-size="7.8">- active_tiles_ : std::vector&lt;TileDescriptor&gt;</text>

    <line x1="0" y1="58" x2="240" y2="58" stroke="#334155"/>

    <text x="12" y="72" fill="#34d399" font-size="7.8">+ static TileManager&amp; getInstance()</text>
    <text x="12" y="86" fill="#34d399" font-size="7.8">+ void sliceGeoTIFF(const std::string&amp; path)</text>
    <text x="12" y="100" fill="#34d399" font-size="7.8">+ void featherBlendOverlap(float alpha = 0.5)</text>
    <text x="12" y="118" fill="#10b981" font-size="7.5" font-weight="bold">★ RAII Invariant &amp; Sliding Window</text>
  </g>

  <!-- INHERITANCE: Concrete Processors (Bottom Row) -->
  <!-- Derived Class 1: SuperResolutionProcessor -->
  <g transform="translate(30, 215)" font-family="monospace">
    <rect width="240" height="110" rx="8" fill="url(#derivedGrad)" stroke="#22d3ee" stroke-width="1.2"/>
    <rect width="240" height="22" rx="8" fill="#0c4a6e"/>
    <text x="120" y="15" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="bold">SuperResolutionProcessor : ITileProcessor</text>
    <text x="12" y="38" fill="#94a3b8" font-size="7.8">- scale_factor_ : uint8_t [2, 4, 8]</text>
    <text x="12" y="50" fill="#94a3b8" font-size="7.8">- model_checkpoint_ : std::string</text>
    <line x1="0" y1="56" x2="240" y2="56" stroke="#1e3a5f"/>
    <text x="12" y="70" fill="#67e8f9" font-size="7.8">+ void processTile(...) override [Polymorphism]</text>
    <text x="12" y="84" fill="#67e8f9" font-size="7.8">+ void executeUBCFBicubicFilter()</text>
    <text x="12" y="98" fill="#10b981" font-size="7.5">Output: [3×, 512, 512] float32 tensor</text>
  </g>

  <!-- Derived Class 2: SegmentationProcessor -->
  <g transform="translate(310, 215)" font-family="monospace">
    <rect width="240" height="110" rx="8" fill="url(#derivedGrad)" stroke="#a855f7" stroke-width="1.2"/>
    <rect width="240" height="22" rx="8" fill="#581c87"/>
    <text x="120" y="15" text-anchor="middle" fill="#d8b4fe" font-size="8.5" font-weight="bold">SegmentationProcessor : ITileProcessor</text>
    <text x="12" y="38" fill="#94a3b8" font-size="7.8">- num_classes_ : uint8_t = 11 [WorldCover]</text>
    <text x="12" y="50" fill="#94a3b8" font-size="7.8">- color_palette_ : uint32_t[11]</text>
    <line x1="0" y1="56" x2="240" y2="56" stroke="#3b0764"/>
    <text x="12" y="70" fill="#c084fc" font-size="7.8">+ void processTile(...) override</text>
    <text x="12" y="84" fill="#c084fc" font-size="7.8">+ void computeConfusionMatrix()</text>
    <text x="12" y="98" fill="#10b981" font-size="7.5">Output: [11×, 256, 256] class argmax</text>
  </g>

  <!-- Factory Pattern Class -->
  <g transform="translate(590, 215)" font-family="monospace">
    <rect width="240" height="110" rx="8" fill="url(#baseGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="240" height="22" rx="8" fill="#78350f"/>
    <text x="120" y="15" text-anchor="middle" fill="#fde68a" font-size="8.5" font-weight="bold">TileProcessorFactory [Factory Pattern]</text>
    <text x="12" y="38" fill="#94a3b8" font-size="7.8">- registry_ : std::unordered_map&lt;...&gt;</text>
    <line x1="0" y1="46" x2="240" y2="46" stroke="#451a03"/>
    <text x="12" y="60" fill="#fbbf24" font-size="7.8">+ static std::unique_ptr&lt;ITileProcessor&gt;</text>
    <text x="12" y="74" fill="#fbbf24" font-size="7.8">    create(const std::string&amp; type)</text>
    <text x="12" y="92" fill="#d97706" font-size="7.5">★ Polymorphic Factory Instantiation</text>
  </g>

  <!-- Connectors -->
  <!-- ITileProcessor -> SuperResolutionProcessor (Inheritance arrow) -->
  <line x1="150" y1="180" x2="150" y2="215" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#mInh)"/>

  <!-- ITileProcessor -> SegmentationProcessor -->
  <path d="M 150,180 L 150,195 L 430,195 L 430,215" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#mInh)"/>

  <!-- Factory -> Processors -->
  <path d="M 590,270 L 550,270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#mUML)"/>
</svg>
