<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 50">
  <defs>
    <linearGradient id="gCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes waveM1 {
        0%,100% { d: path("M0,25 C150,5 300,45 430,25 C560,5 710,45 860,25"); }
        50%     { d: path("M0,25 C150,45 300,5 430,25 C560,45 710,5 860,25"); }
      }
      @keyframes waveM2 {
        0%,100% { d: path("M0,25 C180,40 350,10 500,25 C650,40 750,10 860,25"); }
        50%     { d: path("M0,25 C180,10 350,40 500,25 C650,10 750,40 860,25"); }
      }
    </style>
  </defs>
  <rect width="860" height="50" fill="transparent"/>
  <path d="M0,25 C150,5 300,45 430,25 C560,5 710,45 860,25" fill="none" stroke="url(#gCyan)" stroke-width="2.5" stroke-linecap="round" style="animation:waveM1 4s ease-in-out infinite"/>
  <path d="M0,25 C180,40 350,10 500,25 C650,40 750,10 860,25" fill="none" stroke="url(#gCyan)" stroke-width="1.2" stroke-linecap="round" opacity="0.5" style="animation:waveM2 5s ease-in-out infinite"/>
</svg>
