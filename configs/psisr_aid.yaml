# Configuration for Progressive Satellite Image Super-Resolution (PSISR)
# Research Paper: Sharma et al. (2025) - Chemometrics and Intelligent Laboratory Systems
# DOI: 10.1016/j.chemolab.2024.105277

experiment_name: psisr_aid_benchmark

dataset:
  name: aid
  root: data/aid
  patch_size: 64            # Section 3.3: 64x64 LR patches extracted for training
  split_ratio: 0.8          # Stratified train/val split across 30 classes
  progressive: true         # Provides ground-truth for 2x (128px), 4x (256px), 8x (512px)

model:
  name: psisr
  in_channels: 3
  out_channels: 3
  base_filters: 64          # UB1: 256, UB2: 128, UB3: 64 filters

training:
  optimizer: adam           # Section 3.3: Adam optimization approach
  lr: 0.0001                # Section 3.3: learning rate began at 10^(-4) (1e-4)
  lr_step_size: 100         # Section 3.3: reduced by a factor of 10 every 100 epochs
  lr_gamma: 0.1             # factor of 10 reduction
  loss: combined            # Section 3.1 & Equations 7-8: Adaptive Combined Loss (MSE + SSIM)
  batch_size: 8
  epochs: 200
  num_workers: 0
  scales: [2, 4, 8]
  save_dir: checkpoints/psisr
  log_dir: runs/psisr
