<svg
  width="100%"
  height="220"
  viewBox="0 0 1200 220"
  xmlns="http://www.w3.org/2000/svg"
  style="background: transparent; overflow: hidden; border-radius: 16px;"
>
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#051329" />
      <stop offset="80%" stop-color="#0a1e3f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Wave Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wavePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="220" fill="url(#spaceGrad)" rx="16" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="80" r="160" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="140" r="180" fill="#7c3aed" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="40" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Ambient Waves -->
  <g opacity="0.85">
    <path fill="url(#wavePurple)" opacity="0.45">
      <animate
        attributeName="d"
        dur="14s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 220 L0 150 Q 300 200 600 160 T 1200 170 L 1200 220 Z;
          M0 220 L0 170 Q 300 140 600 180 T 1200 150 L 1200 220 Z;
          M0 220 L0 140 Q 300 180 600 150 T 1200 180 L 1200 220 Z;
          M0 220 L0 150 Q 300 200 600 160 T 1200 170 L 1200 220 Z
        "
      />
    </path>

    <path fill="url(#waveCyan)" opacity="0.65">
      <animate
        attributeName="d"
        dur="10s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 220 L0 175 Q 300 145 600 185 T 1200 165 L 1200 220 Z;
          M0 220 L0 155 Q 300 190 600 150 T 1200 185 L 1200 220 Z;
          M0 220 L0 180 Q 300 160 600 190 T 1200 155 L 1200 220 Z;
          M0 220 L0 175 Q 300 145 600 185 T 1200 165 L 1200 220 Z
        "
      />
    </path>
  </g>

  <!-- Constellation Accent Dots -->
  <g opacity="0.4" fill="#38bdf8">
    <circle cx="120" cy="50" r="1.5" />
    <circle cx="280" cy="30" r="1" />
    <circle cx="450" cy="70" r="2" />
    <circle cx="750" cy="40" r="1.5" />
    <circle cx="920" cy="65" r="2" />
    <circle cx="1080" cy="35" r="1" />
  </g>

  <!-- Tag Pill Badge Above Title -->
  <g transform="translate(600, 42)">
    <rect x="-125" y="-14" width="250" height="26" rx="13" fill="#091b36" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <text text-anchor="middle" dominant-baseline="central" class="badge-text" fill="#38bdf8">EARTH OBSERVATION AI PLATFORM</text>
  </g>

  <!-- Title Text with Rich Gradient & Shadow -->
  <text text-anchor="middle" x="600" y="105" class="title-text" fill="url(#textGrad)" filter="url(#glow)">
    🛰️ GeoSeg
  </text>

  <!-- Subtitle Description -->
  <text text-anchor="middle" x="600" y="145" class="subtitle-text">
    Sentinel-2 Land Cover Segmentation &amp; Progressive Super-Resolution (PSISR)
  </text>

  <!-- Border Highlight Line at Bottom -->
  <rect x="0" y="218" width="1200" height="2" fill="url(#waveCyan)" />
</svg>
