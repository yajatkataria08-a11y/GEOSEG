<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280">
  <defs>
    <style>
      @keyframes barGrow1 { from{height:0;y:240} to{height:35;y:205} }
      @keyframes barGrow2 { from{height:0;y:240} to{height:80;y:160} }
      @keyframes barGrow3 { from{height:0;y:240} to{height:101;y:139} }
      @keyframes barGrow4 { from{height:0;y:240} to{height:118;y:122} }
      @keyframes barGrow5 { from{height:0;y:240} to{height:131;y:109} }
      @keyframes barGrow6 { from{height:0;y:240} to{height:212;y:28} }
      @keyframes labelFade { from{opacity:0} to{opacity:1} }
      @keyframes dashPop  { from{opacity:0;stroke-dashoffset:400} to{opacity:.7;stroke-dashoffset:0} }
      @keyframes crownBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    </style>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#065f46"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="b6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
  </defs>

  <rect width="860" height="280" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="430" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b" font-weight="bold">PSNR @ 2× Super-Resolution — Benchmark Comparison</text>

  <!-- Grid lines -->
  <line x1="100" y1="40"  x2="830" y2="40"  stroke="#1e293b" stroke-width="1"/>
  <line x1="100" y1="90"  x2="830" y2="90"  stroke="#1e293b" stroke-width="1"/>
  <line x1="100" y1="140" x2="830" y2="140" stroke="#1e293b" stroke-width="1"/>
  <line x1="100" y1="190" x2="830" y2="190" stroke="#1e293b" stroke-width="1"/>
  <line x1="100" y1="240" x2="830" y2="240" stroke="#334155" stroke-width="1.5"/>

  <!-- Y axis -->
  <line x1="100" y1="40" x2="100" y2="240" stroke="#334155" stroke-width="1.5"/>

  <!-- Y labels -->
  <text x="92" y="244" text-anchor="end" font-family="monospace" font-size="9" fill="#475569">30dB</text>
  <text x="92" y="194" text-anchor="end" font-family="monospace" font-size="9" fill="#475569">32dB</text>
  <text x="92" y="144" text-anchor="end" font-family="monospace" font-size="9" fill="#475569">34dB</text>
  <text x="92" y="94"  text-anchor="end" font-family="monospace" font-size="9" fill="#475569">36dB</text>
  <text x="92" y="44"  text-anchor="end" font-family="monospace" font-size="9" fill="#475569">38dB</text>

  <!-- Bar 1: Bicubic 31.42dB → h=35px -->
  <rect x="120" y="240" width="85" height="0" rx="5" fill="url(#b1)" style="animation:barGrow1 1s ease-out .2s both"/>
  <text x="162" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" style="animation:labelFade .3s ease-out 1s both">Bicubic</text>
  <text x="162" y="200" text-anchor="middle" font-family="monospace" font-size="9" fill="#60a5fa" style="animation:labelFade .3s ease-out 1.2s both">31.42</text>

  <!-- Bar 2: SRCNN 33.18dB → h=80px -->
  <rect x="230" y="240" width="85" height="0" rx="5" fill="url(#b2)" style="animation:barGrow2 1s ease-out .4s both"/>
  <text x="272" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" style="animation:labelFade .3s ease-out 1.2s both">SRCNN</text>
  <text x="272" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399" style="animation:labelFade .3s ease-out 1.4s both">33.18</text>

  <!-- Bar 3: VDSR 34.05dB → h=101px -->
  <rect x="340" y="240" width="85" height="0" rx="5" fill="url(#b3)" style="animation:barGrow3 1s ease-out .6s both"/>
  <text x="382" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" style="animation:labelFade .3s ease-out 1.4s both">VDSR</text>
  <text x="382" y="134" text-anchor="middle" font-family="monospace" font-size="9" fill="#818cf8" style="animation:labelFade .3s ease-out 1.6s both">34.05</text>

  <!-- Bar 4: RCAN 35.12dB → h=118px -->
  <rect x="450" y="240" width="85" height="0" rx="5" fill="url(#b4)" style="animation:barGrow4 1s ease-out .8s both"/>
  <text x="492" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" style="animation:labelFade .3s ease-out 1.6s both">RCAN</text>
  <text x="492" y="117" text-anchor="middle" font-family="monospace" font-size="9" fill="#e879f9" style="animation:labelFade .3s ease-out 1.8s both">35.12</text>

  <!-- Bar 5: MambaFormer 35.45dB → h=131px -->
  <rect x="560" y="240" width="85" height="0" rx="5" fill="url(#b5)" style="animation:barGrow5 1s ease-out 1s both"/>
  <text x="602" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" style="animation:labelFade .3s ease-out 1.8s both">MambaFormer</text>
  <text x="602" y="104" text-anchor="middle" font-family="monospace" font-size="9" fill="#fb923c" style="animation:labelFade .3s ease-out 2s both">35.45</text>

  <!-- Bar 6: PSISR 38.47dB → h=212px (SOTA) -->
  <rect x="700" y="240" width="85" height="0" rx="5" fill="url(#b6)" stroke="#22d3ee" stroke-width="1.5" style="animation:barGrow6 1.5s ease-out 1.2s both"/>
  <text x="742" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#22d3ee" font-weight="bold" style="animation:labelFade .3s ease-out 2.5s both">PSISR (Ours)</text>

  <!-- Crown icon -->
  <text x="742" y="20" text-anchor="middle" font-size="18" style="animation:crownBob 2s ease-in-out 2.5s infinite;animation-fill-mode:backwards;opacity:0">👑</text>
  <animate xlink:href="text" attributeName="opacity" from="0" to="1" dur=".3s" begin="2.5s" fill="freeze"/>
  <text x="742" y="23" text-anchor="middle" font-family="monospace" font-size="11" fill="#22d3ee" font-weight="bold" style="animation:labelFade .3s ease-out 2.7s both">38.47 dB</text>

  <!-- +3.02 dB gain connector line -->
  <line x1="604" y1="109" x2="700" y2="28" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="400" stroke-dashoffset="400" opacity="0" style="animation:dashPop .8s ease-out 2.8s both"/>
  <text x="648" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee" font-weight="bold" style="animation:labelFade .4s ease-out 3.5s both">+3.02 dB</text>

  <!-- Bottom label -->
  <text x="430" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#334155">AID + WHU-RS19 Dataset · 2× Super-Resolution Scale Factor</text>
</svg>
