<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340">
  <defs>
    <style>
      @keyframes slideIn  { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
      @keyframes pulse    { 0%,100%{stroke-opacity:.4} 50%{stroke-opacity:1} }
      @keyframes arrowFlow{ 0%{stroke-dashoffset:80} 100%{stroke-dashoffset:0} }
      @keyframes badgePop { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
      @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    </style>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#22d3ee"/></marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#818cf8"/></marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#34d399"/></marker>
    <linearGradient id="frontL" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0c1a2e"/></linearGradient>
    <linearGradient id="backL"  x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a3e"/><stop offset="100%" stop-color="#0a0a1e"/></linearGradient>
    <linearGradient id="mlL"    x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2e1a"/><stop offset="100%" stop-color="#0a180a"/></linearGradient>
  </defs>

  <rect width="860" height="340" fill="#020617" rx="12"/>
  <text x="430" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b" font-weight="bold">Full-Stack Architecture — React ↔ FastAPI ↔ PyTorch</text>

  <!-- FRONTEND COLUMN -->
  <g style="animation:slideIn .5s ease-out .1s both">
    <rect x="15"  y="35" width="235" height="295" rx="12" fill="url(#frontL)" stroke="#22d3ee" stroke-width="1.5" style="animation:pulse 3s ease-in-out infinite"/>
    <text x="132" y="58"  text-anchor="middle" font-family="monospace" font-size="11" fill="#22d3ee" font-weight="bold">🖥️  FRONTEND</text>
    <text x="132" y="73"  text-anchor="middle" font-family="monospace" font-size="8"  fill="#475569">React 18 · Vite 5 · Tailwind CSS v4</text>
    <!-- Components -->
    <rect x="28" y="82"  width="210" height="22" rx="5" fill="#0c3a5a"/>
    <text x="133" y="97"  text-anchor="middle" font-family="monospace" font-size="8" fill="#93c5fd">Dashboard.tsx — 3D Globe</text>
    <rect x="28" y="110" width="210" height="22" rx="5" fill="#0c3a5a"/>
    <text x="133" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#93c5fd">SuperResolution.tsx — SR UI</text>
    <rect x="28" y="138" width="210" height="22" rx="5" fill="#0c3a5a"/>
    <text x="133" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#93c5fd">Segmentation.tsx — MapView</text>
    <rect x="28" y="166" width="210" height="22" rx="5" fill="#0c3a5a"/>
    <text x="133" y="181" text-anchor="middle" font-family="monospace" font-size="8" fill="#93c5fd">Inference.tsx — Model Runner</text>
    <rect x="28" y="194" width="210" height="22" rx="5" fill="#0c3a5a"/>
    <text x="133" y="209" text-anchor="middle" font-family="monospace" font-size="8" fill="#93c5fd">Results.tsx — Benchmarks</text>
    <!-- Service layer -->
    <rect x="28" y="224" width="210" height="22" rx="5" fill="#1e3a5f" stroke="#38bdf8" stroke-width=".8"/>
    <text x="133" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#38bdf8">superResolutionApi.ts</text>
    <rect x="28" y="252" width="210" height="22" rx="5" fill="#1e3a5f" stroke="#38bdf8" stroke-width=".8"/>
    <text x="133" y="267" text-anchor="middle" font-family="monospace" font-size="8" fill="#38bdf8">inferenceApi.ts · api.ts</text>
    <!-- Libs -->
    <rect x="28" y="280" width="100" height="18" rx="4" fill="#0f2233"/>
    <text x="78" y="292" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">Three.js Globe</text>
    <rect x="135" y="280" width="100" height="18" rx="4" fill="#0f2233"/>
    <text x="185" y="292" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">Framer Motion</text>
    <text x="132" y="320" text-anchor="middle" font-family="monospace" font-size="8" fill="#0ea5e9">http://127.0.0.1:5173</text>
  </g>

  <!-- Bidirectional REST arrows -->
  <g style="animation:arrowFlow 1s ease-out .8s infinite" stroke-dasharray="80" stroke-dashoffset="80">
    <line x1="252" y1="155" x2="308" y2="155" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#a1)"/>
  </g>
  <line x1="308" y1="173" x2="252" y2="173" stroke="#818cf8" stroke-width="2.5" marker-end="url(#a2)" stroke-dasharray="80" stroke-dashoffset="80" style="animation:arrowFlow 1s ease-out 1.3s infinite"/>
  <text x="280" y="148" text-anchor="middle" font-family="monospace" font-size="7" fill="#22d3ee">REST/JSON</text>
  <text x="280" y="188" text-anchor="middle" font-family="monospace" font-size="7" fill="#818cf8">Response</text>

  <!-- BACKEND COLUMN -->
  <g style="animation:slideIn .5s ease-out .5s both">
    <rect x="313" y="35" width="235" height="295" rx="12" fill="url(#backL)" stroke="#818cf8" stroke-width="1.5" style="animation:pulse 3.5s ease-in-out .5s infinite"/>
    <text x="430" y="58"  text-anchor="middle" font-family="monospace" font-size="11" fill="#818cf8" font-weight="bold">⚙️  BACKEND API</text>
    <text x="430" y="73"  text-anchor="middle" font-family="monospace" font-size="8"  fill="#475569">FastAPI 0.115 · Uvicorn · Pydantic v2</text>
    <rect x="326" y="82"  width="210" height="22" rx="5" fill="#1e1b4b"/>
    <text x="431" y="97"  text-anchor="middle" font-family="monospace" font-size="8" fill="#c4b5fd">server.py — CORS + Middleware</text>
    <rect x="326" y="110" width="210" height="22" rx="5" fill="#1e1b4b"/>
    <text x="431" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#c4b5fd">super_resolution.py</text>
    <rect x="326" y="138" width="210" height="22" rx="5" fill="#1e1b4b"/>
    <text x="431" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#c4b5fd">inference.py — Model runner</text>
    <rect x="326" y="166" width="210" height="22" rx="5" fill="#1e1b4b"/>
    <text x="431" y="181" text-anchor="middle" font-family="monospace" font-size="8" fill="#c4b5fd">segmentation.py — U-Net</text>
    <rect x="326" y="194" width="210" height="22" rx="5" fill="#1e1b4b"/>
    <text x="431" y="209" text-anchor="middle" font-family="monospace" font-size="8" fill="#c4b5fd">results.py — Checkpoints</text>
    <rect x="326" y="224" width="210" height="22" rx="5" fill="#2d1b69" stroke="#6d28d9" stroke-width=".8"/>
    <text x="431" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa">18 REST Endpoints</text>
    <rect x="326" y="252" width="100" height="18" rx="4" fill="#0f0a2e"/>
    <text x="376" y="264" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">Pydantic v2</text>
    <rect x="434" y="252" width="100" height="18" rx="4" fill="#0f0a2e"/>
    <text x="484" y="264" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">AsyncIO</text>
    <text x="430" y="320" text-anchor="middle" font-family="monospace" font-size="8" fill="#7c3aed">http://127.0.0.1:8000</text>
  </g>

  <!-- PyTorch arrows -->
  <line x1="550" y1="155" x2="606" y2="155" stroke="#818cf8" stroke-width="2.5" marker-end="url(#a2)" stroke-dasharray="80" stroke-dashoffset="80" style="animation:arrowFlow 1s ease-out 1.1s infinite"/>
  <line x1="606" y1="173" x2="550" y2="173" stroke="#34d399" stroke-width="2.5" marker-end="url(#a3)" stroke-dasharray="80" stroke-dashoffset="80" style="animation:arrowFlow 1s ease-out 1.6s infinite"/>
  <text x="578" y="148" text-anchor="middle" font-family="monospace" font-size="7" fill="#818cf8">PyTorch</text>
  <text x="578" y="188" text-anchor="middle" font-family="monospace" font-size="7" fill="#34d399">Tensors</text>

  <!-- ML COLUMN -->
  <g style="animation:slideIn .5s ease-out .9s both">
    <rect x="611" y="35" width="235" height="295" rx="12" fill="url(#mlL)" stroke="#34d399" stroke-width="1.5" style="animation:pulse 4s ease-in-out 1s infinite"/>
    <text x="728" y="58"  text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399" font-weight="bold">🤖  AI / ML CORE</text>
    <text x="728" y="73"  text-anchor="middle" font-family="monospace" font-size="8"  fill="#475569">PyTorch 2.5 · C++17 SIMD · CUDA</text>
    <rect x="624" y="82"  width="210" height="22" rx="5" fill="#052e16"/>
    <text x="729" y="97"  text-anchor="middle" font-family="monospace" font-size="8" fill="#86efac">PSISRNet — UBCF SR Model</text>
    <rect x="624" y="110" width="210" height="22" rx="5" fill="#052e16"/>
    <text x="729" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#86efac">GeoSeg U-Net 16ch Seg.</text>
    <rect x="624" y="138" width="210" height="22" rx="5" fill="#052e16"/>
    <text x="729" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#86efac">src/train.py — Training Loop</text>
    <rect x="624" y="166" width="210" height="22" rx="5" fill="#052e16"/>
    <text x="729" y="181" text-anchor="middle" font-family="monospace" font-size="8" fill="#86efac">src/infer.py — Inference</text>
    <rect x="624" y="194" width="210" height="22" rx="5" fill="#052e16"/>
    <text x="729" y="209" text-anchor="middle" font-family="monospace" font-size="8" fill="#86efac">checkpoints/ — Model Weights</text>
    <rect x="624" y="224" width="210" height="22" rx="5" fill="#14532d" stroke="#16a34a" stroke-width=".8"/>
    <text x="729" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ade80">bandmath.cpp · tilemanager.cpp</text>
    <rect x="624" y="252" width="100" height="18" rx="4" fill="#052e16"/>
    <text x="674" y="264" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">CUDA / AMP FP16</text>
    <rect x="732" y="252" width="100" height="18" rx="4" fill="#052e16"/>
    <text x="782" y="264" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">GDAL / rasterio</text>
    <text x="728" y="320" text-anchor="middle" font-family="monospace" font-size="8" fill="#16a34a">data/ · checkpoints/ · outputs/</text>
  </g>
</svg>
