<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380">
  <defs>
    <style>
      @keyframes skipFlow { 0%{stroke-dashoffset:160} 100%{stroke-dashoffset:0} }
      @keyframes blockGlow{ 0%,100%{stroke-opacity:.4} 50%{stroke-opacity:1} }
      @keyframes pulseNode{ 0%,100%{r:4} 50%{r:6.5;fill:#22d3ee} }
      @keyframes pulseFlow{ from{offset-distance:0%} to{offset-distance:100%} }
    </style>
    <marker id="skipArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3z" fill="#22d3ee"/>
    </marker>
    <linearGradient id="encGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0e2a47"/></linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/></linearGradient>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#052e16"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
  </defs>

  <rect width="860" height="380" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🧠 16-CHANNEL MULTISPECTRAL GEOSEG U-NET (RESNET-34 ENCODER + ATTENTION DECODER)
  </text>

  <!-- Input Tensor Tag -->
  <rect x="25" y="45" width="105" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="77" y="60" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#38bdf8" font-weight="bold">Input Tensor</text>
  <text x="77" y="73" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">[B, 16, 256, 256]</text>

  <!-- Output Mask Tag -->
  <rect x="730" y="45" width="105" height="36" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="782" y="60" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#34d399" font-weight="bold">Class Logits</text>
  <text x="782" y="73" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">[B, 11, 256, 256]</text>

  <!-- ENCODER PATH (Left Column - Contracting) -->
  <!-- Level 1: 256x256 -->
  <rect x="40" y="95" width="130" height="40" rx="6" fill="url(#encGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="105" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">Conv1 + BN + ReLU</text>
  <text x="105" y="126" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">64 ch · 256×256</text>

  <!-- Level 2: 128x128 -->
  <rect x="70" y="150" width="130" height="40" rx="6" fill="url(#encGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="135" y="167" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">ResNet Layer 1</text>
  <text x="135" y="181" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">64 ch · 128×128</text>

  <!-- Level 3: 64x64 -->
  <rect x="100" y="205" width="130" height="40" rx="6" fill="url(#encGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="165" y="222" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">ResNet Layer 2</text>
  <text x="165" y="236" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">128 ch · 64×64</text>

  <!-- Level 4: 32x32 -->
  <rect x="130" y="260" width="130" height="40" rx="6" fill="url(#encGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="195" y="277" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">ResNet Layer 3</text>
  <text x="195" y="291" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">256 ch · 32×32</text>

  <!-- BOTTLENECK (Center Deepest) -->
  <rect x="330" y="315" width="200" height="42" rx="8" fill="url(#neckGrad)" stroke="#10b981" stroke-width="1.8" style="animation:blockGlow 2.5s infinite"/>
  <text x="430" y="333" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#34d399" font-weight="bold">Bottleneck Bridge Layer</text>
  <text x="430" y="347" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#86efac">512 ch · 16×16 · Max Receptive Field</text>

  <!-- DECODER PATH (Right Column - Expanding) -->
  <!-- Level 4: 32x32 -->
  <rect x="600" y="260" width="130" height="40" rx="6" fill="url(#decGrad)" stroke="#818cf8" stroke-width="1.2"/>
  <text x="665" y="277" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">UpConv Block 4</text>
  <text x="665" y="291" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">256 ch · 32×32</text>

  <!-- Level 3: 64x64 -->
  <rect x="630" y="205" width="130" height="40" rx="6" fill="url(#decGrad)" stroke="#818cf8" stroke-width="1.2"/>
  <text x="695" y="222" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">UpConv Block 3</text>
  <text x="695" y="236" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">128 ch · 64×64</text>

  <!-- Level 2: 128x128 -->
  <rect x="660" y="150" width="130" height="40" rx="6" fill="url(#decGrad)" stroke="#818cf8" stroke-width="1.2"/>
  <text x="725" y="167" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">UpConv Block 2</text>
  <text x="725" y="181" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">64 ch · 128×128</text>

  <!-- Level 1: 256x256 -->
  <rect x="690" y="95" width="130" height="40" rx="6" fill="url(#decGrad)" stroke="#818cf8" stroke-width="1.2"/>
  <text x="755" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">UpConv Block 1</text>
  <text x="755" y="126" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">32 ch · 256×256</text>

  <!-- DOWNWARD ENCODER CONNECTORS -->
  <line x1="105" y1="135" x2="135" y2="150" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="135" y1="190" x2="165" y2="205" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="165" y1="245" x2="195" y2="260" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="195" y1="300" x2="330" y2="330" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- UPWARD DECODER CONNECTORS -->
  <line x1="530" y1="330" x2="665" y2="300" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="665" y1="260" x2="695" y2="245" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="695" y1="205" x2="725" y2="190" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="725" y1="150" x2="755" y2="135" stroke="#818cf8" stroke-width="1.5"/>

  <!-- ANIMATED HORIZONTAL SKIP CONNECTIONS -->
  <!-- Skip 1: Level 1 -->
  <line x1="170" y1="115" x2="690" y2="115" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#skipArrow)" style="animation:skipFlow 1.8s linear infinite"/>
  <text x="430" y="110" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#22d3ee">Skip Connection 1 [High-Freq Boundary Edges]</text>

  <!-- Skip 2: Level 2 -->
  <line x1="200" y1="170" x2="660" y2="170" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#skipArrow)" style="animation:skipFlow 1.8s linear infinite"/>
  <text x="430" y="165" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#22d3ee">Skip Connection 2 [Fine Spatial Textures]</text>

  <!-- Skip 3: Level 3 -->
  <line x1="230" y1="225" x2="630" y2="225" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#skipArrow)" style="animation:skipFlow 1.8s linear infinite"/>
  <text x="430" y="220" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#22d3ee">Skip Connection 3 [Mid-Level Parcel Geometries]</text>

  <!-- Skip 4: Level 4 -->
  <line x1="260" y1="280" x2="600" y2="280" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#skipArrow)" style="animation:skipFlow 1.8s linear infinite"/>
  <text x="430" y="275" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#22d3ee">Skip Connection 4 [Deep Contextual Semantics]</text>
</svg>
