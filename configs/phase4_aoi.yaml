# Phase 4 — Custom AOI Export + Inference
# Goal: Pull real Sentinel-2 imagery for any AOI and produce a classified GeoTIFF.

phase: 4

inference:
  model_checkpoint: outputs/checkpoints/phase3/best_model.pth
  input_tif: data/aoi_export/aoi_export.tif
  output_tif: outputs/predictions/aoi_landcover.tif
  tile_size: 512
  overlap: 32
  batch_size: 4            # Batch multiple tiles for faster inference
  device: cuda
  band_order:
    - B01
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B09
    - B10
    - B11
    - B12
  use_indices: true
  reflectance_scale: 10000.0

model:
  name: unet
  encoder: resnet34
  in_channels: 16         # Must match Phase 3 training config
  num_classes: 11

aoi_export:
  region: [76.90, 23.05, 77.10, 23.20]   # [west, south, east, north]
  date_range: ["2025-01-01", "2025-06-01"]
  max_cloud_pct: 10
  scale: 10                # Sentinel-2 native resolution (meters)
  gcp_project: your-gcp-project
  export_folder: s2_exports
