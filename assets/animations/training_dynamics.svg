<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320">
  <defs>
    <style>
      @keyframes drawLoss { from{stroke-dashoffset:1200} to{stroke-dashoffset:0} }
      @keyframes drawPsnr { from{stroke-dashoffset:1200} to{stroke-dashoffset:0} }
      @keyframes pointPop { 0%{opacity:0;transform:scale(0)} 70%{transform:scale(1.3)} 100%{opacity:1;transform:scale(1)} }
      @keyframes scanH { 0%{x:100;opacity:0} 10%{opacity:.5} 90%{opacity:.5} 100%{x:820;opacity:0} }
      @keyframes textIn { from{opacity:0} to{opacity:1} }
    </style>
    <linearGradient id="lossGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="psnrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="860" height="320" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8" font-weight="bold">
    📈 TRAINING CONVERGENCE TELEMETRY — LOSS ↓ &amp; PSNR ↑ DYNAMICS (EPOCHS 1–3)
  </text>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="90" y1="50"  x2="800" y2="50"/>
    <line x1="90" y1="105" x2="800" y2="105"/>
    <line x1="90" y1="160" x2="800" y2="160"/>
    <line x1="90" y1="215" x2="800" y2="215"/>
    <line x1="90" y1="265" x2="800" y2="265" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Y-Axis (Loss - Left) -->
  <line x1="90" y1="50" x2="90" y2="265" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="55"  text-anchor="end" font-family="monospace" font-size="9" fill="#f87171">1.00</text>
  <text x="80" y="110" text-anchor="end" font-family="monospace" font-size="9" fill="#f87171">0.75</text>
  <text x="80" y="165" text-anchor="end" font-family="monospace" font-size="9" fill="#f87171">0.50</text>
  <text x="80" y="220" text-anchor="end" font-family="monospace" font-size="9" fill="#f87171">0.25</text>
  <text x="80" y="268" text-anchor="end" font-family="monospace" font-size="9" fill="#f87171">0.00</text>
  <text x="35" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#ef4444" transform="rotate(-90 35 160)">Composite Loss L_CL</text>

  <!-- Y-Axis (PSNR - Right) -->
  <line x1="800" y1="50" x2="800" y2="265" stroke="#334155" stroke-width="1.5"/>
  <text x="812" y="55"  text-anchor="start" font-family="monospace" font-size="9" fill="#38bdf8">39 dB</text>
  <text x="812" y="110" text-anchor="start" font-family="monospace" font-size="9" fill="#38bdf8">37 dB</text>
  <text x="812" y="165" text-anchor="start" font-family="monospace" font-size="9" fill="#38bdf8">35 dB</text>
  <text x="812" y="220" text-anchor="start" font-family="monospace" font-size="9" fill="#38bdf8">33 dB</text>
  <text x="812" y="268" text-anchor="start" font-family="monospace" font-size="9" fill="#38bdf8">31 dB</text>
  <text x="848" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee" transform="rotate(90 848 160)">Validation PSNR (dB)</text>

  <!-- Epoch Markers on X Axis -->
  <!-- Epoch 1: x=210, Epoch 2: x=445, Epoch 3: x=680 -->
  <line x1="210" y1="265" x2="210" y2="50" stroke="#1e293b" stroke-dasharray="4,4"/>
  <line x1="445" y1="265" x2="445" y2="50" stroke="#1e293b" stroke-dasharray="4,4"/>
  <line x1="680" y1="265" x2="680" y2="50" stroke="#1e293b" stroke-dasharray="4,4"/>
  <text x="210" y="282" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Epoch 1</text>
  <text x="445" y="282" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Epoch 2</text>
  <text x="680" y="282" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee" font-weight="bold">Epoch 3 (Final)</text>

  <!-- Loss Curve (decreasing): (90, 70) -> (210, 85) -> (445, 172) -> (680, 225) -->
  <path d="M 90,65 C 150,75 180,85 210,95 C 320,135 380,165 445,178 C 550,200 620,220 680,227"
        fill="none" stroke="url(#lossGrad)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="1200"
        style="animation:drawLoss 2s ease-out forwards"/>

  <!-- PSNR Curve (increasing): (90, 260) -> (210, 215) -> (445, 125) -> (680, 68) -->
  <path d="M 90,260 C 150,245 180,230 210,215 C 320,175 380,140 445,128 C 550,105 620,80 680,68"
        fill="none" stroke="url(#psnrGrad)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="1200"
        style="animation:drawPsnr 2s ease-out .3s forwards"/>

  <!-- Data Points (Loss) -->
  <g style="animation:pointPop .5s ease-out 1.8s both">
    <circle cx="210" cy="95"  r="5" fill="#ef4444" stroke="#0b0f19" stroke-width="2"/>
    <text x="210" y="82" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">0.9245</text>
  </g>
  <g style="animation:pointPop .5s ease-out 2s both">
    <circle cx="445" cy="178" r="5" fill="#ef4444" stroke="#0b0f19" stroke-width="2"/>
    <text x="445" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">0.4872</text>
  </g>
  <g style="animation:pointPop .5s ease-out 2.2s both">
    <circle cx="680" cy="227" r="5" fill="#ef4444" stroke="#0b0f19" stroke-width="2"/>
    <text x="680" y="214" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">0.3104</text>
  </g>

  <!-- Data Points (PSNR) -->
  <g style="animation:pointPop .5s ease-out 2.1s both">
    <circle cx="210" cy="215" r="5" fill="#22d3ee" stroke="#0b0f19" stroke-width="2"/>
    <text x="210" y="235" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">33.21 dB</text>
  </g>
  <g style="animation:pointPop .5s ease-out 2.3s both">
    <circle cx="445" cy="128" r="5" fill="#22d3ee" stroke="#0b0f19" stroke-width="2"/>
    <text x="445" y="148" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">35.68 dB</text>
  </g>
  <g style="animation:pointPop .5s ease-out 2.5s both">
    <circle cx="680" cy="68"  r="6" fill="#22d3ee" stroke="#0b0f19" stroke-width="2"/>
    <text x="680" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee" font-weight="bold">38.47 dB ★ SOTA</text>
  </g>

  <!-- Scanning Vertical Bar -->
  <line y1="50" y2="265" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" style="animation:scanH 4s ease-in-out 3s infinite"/>

  <!-- Legend -->
  <g font-family="monospace" font-size="9" fill="#94a3b8">
    <line x1="280" y1="305" x2="310" y2="305" stroke="#ef4444" stroke-width="3"/>
    <circle cx="295" cy="305" r="3" fill="#ef4444"/>
    <text x="320" y="309">Training Loss L_CL (MSE + SSIM Compound)</text>

    <line x1="560" y1="305" x2="590" y2="305" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="575" cy="305" r="3" fill="#22d3ee"/>
    <text x="600" y="309" fill="#22d3ee" font-weight="bold">Validation PSNR (dB) — Converged</text>
  </g>
</svg>
