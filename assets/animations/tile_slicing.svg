<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330">
  <defs>
    <style>
      @keyframes scanWindow {
        0%,100% { transform: translate(0, 0); }
        25%     { transform: translate(140px, 0); }
        50%     { transform: translate(140px, 120px); }
        75%     { transform: translate(0, 120px); }
      }
      @keyframes blendGlow { 0%,100%{opacity:.2} 50%{opacity:.8} }
    </style>
  </defs>

  <rect width="860" height="330" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🪟 NATIVE C++ TILEMANAGER: SLIDING-WINDOW PARTITIONING &amp; OVERLAP FEATHERING
  </text>

  <!-- Left: Large GeoTIFF Raster Plane [10980 x 10980] -->
  <g transform="translate(40, 50)" font-family="monospace">
    <rect width="360" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="180" y="20" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">Sentinel-2 100km Granule [10,980 × 10,980 px]</text>

    <!-- Sub-grid partitions -->
    <g stroke="#1e293b" stroke-width="1" fill="#1e293b" opacity="0.4">
      <rect x="20" y="35" width="90" height="80" rx="2"/>
      <rect x="130" y="35" width="90" height="80" rx="2"/>
      <rect x="240" y="35" width="90" height="80" rx="2"/>

      <rect x="20" y="130" width="90" height="80" rx="2"/>
      <rect x="130" y="130" width="90" height="80" rx="2"/>
      <rect x="240" y="130" width="90" height="80" rx="2"/>
    </g>

    <!-- Overlap margin zone indicator -->
    <rect x="90" y="35" width="60" height="80" fill="#38bdf8" opacity="0.25" style="animation:blendGlow 2s infinite"/>
    <text x="120" y="80" text-anchor="middle" fill="#22d3ee" font-size="7">Overlap Δ=32px</text>

    <!-- Animated Sliding Window Frame -->
    <g style="animation:scanWindow 8s ease-in-out infinite">
      <rect x="20" y="35" width="130" height="110" rx="4" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="20" cy="35" r="4" fill="#facc15"/>
      <text x="85" y="52" text-anchor="middle" fill="#22d3ee" font-size="8" font-weight="bold">Active Tile [256×256]</text>
    </g>

    <text x="180" y="222" text-anchor="middle" fill="#64748b" font-size="7.5">Sliding Step: stride = size - overlap = 224 px</text>
  </g>

  <!-- Right: Boundary Feathering Distance Weighting -->
  <g transform="translate(440, 50)" font-family="monospace">
    <rect width="380" height="230" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.2"/>
    <text x="190" y="20" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">Cosine Distance-Weighted Boundary Blending</text>

    <!-- Overlap Weight Function Graph -->
    <!-- X: 40 to 340, Y: 120 -->
    <g transform="translate(30, 45)">
      <line x1="20" y1="90" x2="300" y2="90" stroke="#334155" stroke-width="1"/>
      <line x1="20" y1="20" x2="20" y2="90" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" text-anchor="end" fill="#64748b" font-size="7">1.0</text>
      <text x="15" y="94" text-anchor="end" fill="#64748b" font-size="7">0.0</text>

      <!-- Weight Curve Tile A (Descending from 1.0 to 0.0) -->
      <path d="M 20,25 C 100,25 120,90 200,90" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="50" y="45" fill="#38bdf8" font-size="8">Tile A Weight w_A(x)</text>

      <!-- Weight Curve Tile B (Ascending from 0.0 to 1.0) -->
      <path d="M 20,90 C 100,90 120,25 200,25" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="180" y="45" fill="#22c55e" font-size="8">Tile B Weight w_B(x)</text>

      <!-- Overlap Region -->
      <rect x="70" y="20" width="80" height="70" fill="#22d3ee" opacity="0.1"/>
      <text x="110" y="105" text-anchor="middle" fill="#facc15" font-size="7.5">Feather Overlap [0, Δ]</text>
    </g>

    <!-- Formula Box -->
    <rect x="30" y="165" width="320" height="45" rx="6" fill="#021a0c" stroke="#059669" stroke-width="1"/>
    <text x="190" y="184" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">I_{mosaic}(x,y) = w_A(x)·I_A(x,y) + w_B(x)·I_B(x,y)</text>
    <text x="190" y="200" text-anchor="middle" fill="#86efac" font-size="7.5">w_A(x) + w_B(x) ≡ 1.0 · Zero Boundary Seam Discontinuities</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="430" y="310" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    Seamless multi-tile raster reconstruction: sliding tiles eliminate memory exhaustion while cosine feathering prevents edge seams.
  </text>
</svg>
