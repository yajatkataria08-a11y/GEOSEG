<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360">
  <defs>
    <style>
      @keyframes slideDivider {
        0%,100% { transform: translateX(200px); }
        50%     { transform: translateX(640px); }
      }
      @keyframes clipLeft {
        0%,100% { width: 200px; }
        50%     { width: 640px; }
      }
    </style>
    <clipPath id="leftClip">
      <rect x="20" y="45" width="400" height="260" rx="8">
        <animate attributeName="width" values="180;640;180" dur="6s" repeatCount="indefinite" ease="ease-in-out"/>
      </rect>
    </clipPath>
    <linearGradient id="bicubicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="psisrGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="860" height="360" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🔍 LIVE COMPARISON: BICUBIC INTERPOLATION (10m) vs. PSISRNET SOTA (1.25m 8×)
  </text>

  <!-- Container Box -->
  <rect x="20" y="45" width="820" height="260" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- RIGHT BACKGROUND: Crisp PSISRNet 8x Reconstruction -->
  <g>
    <!-- Crisp Urban Grid & Runway -->
    <rect x="20" y="45" width="820" height="260" fill="url(#psisrGrad)" rx="8"/>
    <!-- Crisp runway -->
    <rect x="80" y="160" width="700" height="30" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <!-- Sharp center line stripes -->
    <line x1="100" y1="175" x2="140" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="170" y1="175" x2="210" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="240" y1="175" x2="280" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="310" y1="175" x2="350" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="380" y1="175" x2="420" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="450" y1="175" x2="490" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="520" y1="175" x2="560" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="590" y1="175" x2="630" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="660" y1="175" x2="700" y2="175" stroke="#facc15" stroke-width="3"/>
    <line x1="730" y1="175" x2="770" y2="175" stroke="#facc15" stroke-width="3"/>

    <!-- Sharp Buildings with crisp edges -->
    <rect x="150" y="70" width="80" height="60" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="260" y="60" width="110" height="75" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="400" y="75" width="70" height="55" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="500" y="65" width="130" height="70" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="660" y="70" width="90" height="60" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Sharp Farmland Parcels with distinct borders -->
    <rect x="120" y="220" width="160" height="65" rx="2" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="310" y="215" width="200" height="70" rx="2" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="540" y="220" width="180" height="65" rx="2" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Right Label -->
    <rect x="650" y="55" width="175" height="28" rx="6" fill="#042f2e" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="737" y="73" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee" font-weight="bold">★ PSISRNet: 38.47 dB</text>
  </g>

  <!-- LEFT OVERLAY: Blurry Low-Res Bicubic (Clipped) -->
  <g clip-path="url(#leftClip)">
    <rect x="20" y="45" width="820" height="260" fill="url(#bicubicGrad)"/>
    <!-- Blurry smeared runway -->
    <rect x="80" y="160" width="700" height="30" fill="#1e293b" opacity="0.8" filter="blur(5px)"/>
    <!-- Smeared centerline -->
    <line x1="80" y1="175" x2="780" y2="175" stroke="#ca8a04" stroke-width="8" opacity="0.5" filter="blur(6px)"/>

    <!-- Smeared fuzzy buildings -->
    <rect x="150" y="70" width="80" height="60" rx="8" fill="#334155" opacity="0.6" filter="blur(6px)"/>
    <rect x="260" y="60" width="110" height="75" rx="8" fill="#334155" opacity="0.6" filter="blur(7px)"/>
    <rect x="400" y="75" width="70" height="55" rx="8" fill="#334155" opacity="0.6" filter="blur(6px)"/>
    <rect x="500" y="65" width="130" height="70" rx="8" fill="#334155" opacity="0.6" filter="blur(8px)"/>
    <rect x="660" y="70" width="90" height="60" rx="8" fill="#334155" opacity="0.6" filter="blur(6px)"/>

    <!-- Smeared farmland -->
    <rect x="120" y="220" width="160" height="65" rx="10" fill="#064e3b" opacity="0.6" filter="blur(7px)"/>
    <rect x="310" y="215" width="200" height="70" rx="10" fill="#065f46" opacity="0.6" filter="blur(8px)"/>
    <rect x="540" y="220" width="180" height="65" rx="10" fill="#047857" opacity="0.6" filter="blur(7px)"/>

    <!-- Left Label -->
    <rect x="35" y="55" width="175" height="28" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="122" y="73" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8" font-weight="bold">Bicubic 10m: 31.42 dB</text>
  </g>

  <!-- MOVING SLIDER DIVIDER BAR -->
  <g>
    <line y1="45" y2="305" stroke="#22d3ee" stroke-width="2.5">
      <animate attributeName="x1" values="200;660;200" dur="6s" repeatCount="indefinite" ease="ease-in-out"/>
      <animate attributeName="x2" values="200;660;200" dur="6s" repeatCount="indefinite" ease="ease-in-out"/>
    </line>
    <!-- Handle circle -->
    <circle cy="175" r="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="cx" values="200;660;200" dur="6s" repeatCount="indefinite" ease="ease-in-out"/>
    </circle>
    <text y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee" font-weight="bold">
      <animate attributeName="x" values="200;660;200" dur="6s" repeatCount="indefinite" ease="ease-in-out"/>
      ↔
    </text>
  </g>

  <!-- Bottom subtitle -->
  <text x="430" y="335" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    Drag interactive split-screen slider in web UI to compare high-frequency ground details across all 30 AID scene categories.
  </text>
</svg>
