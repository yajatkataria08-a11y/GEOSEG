<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320">
  <defs>
    <style>
      @keyframes attnFlow { 0%{stroke-dashoffset:70} 100%{stroke-dashoffset:0} }
      @keyframes weightPulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
    <marker id="attArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#22d3ee"/></marker>
    <linearGradient id="sqGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="exGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  </defs>

  <rect width="860" height="320" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    ⚡ UBCF RESIDUAL CHANNEL ATTENTION MECHANISM (RCAM): ADAPTIVE SPECTRAL WEIGHTING
  </text>

  <!-- Step 1: Input Tensor Feature Map -->
  <g transform="translate(30, 50)" font-family="monospace">
    <rect width="140" height="210" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="70" y="25" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">Feature Maps X</text>
    <text x="70" y="42" text-anchor="middle" fill="#94a3b8" font-size="7.5">[C, H, W] = [64, 64, 64]</text>

    <!-- Multi-channel Stack Graphic -->
    <g transform="translate(30, 60)">
      <rect x="0"  y="0"  width="60" height="80" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <rect x="10" y="10" width="60" height="80" rx="3" fill="#2563eb" stroke="#60a5fa" stroke-width="1"/>
      <rect x="20" y="20" width="60" height="80" rx="3" fill="#4f46e5" stroke="#818cf8" stroke-width="1"/>
    </g>
    <text x="70" y="195" text-anchor="middle" fill="#64748b" font-size="7.5">All channels equal wt</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="170" y1="155" x2="200" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#attArr)"/>

  <!-- Step 2: Global Average Pooling (Squeeze) -->
  <g transform="translate(200, 50)" font-family="monospace">
    <rect width="150" height="210" rx="8" fill="url(#sqGrad)" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="75" y="25" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="bold">1. Squeeze Step</text>
    <text x="75" y="42" text-anchor="middle" fill="#a5f3fc" font-size="7.5">Global Avg Pooling</text>

    <!-- 1D Vector [C, 1, 1] -->
    <g transform="translate(60, 65)">
      <rect x="0" y="0"  width="30" height="15" rx="2" fill="#0ea5e9"/>
      <rect x="0" y="18" width="30" height="15" rx="2" fill="#0ea5e9"/>
      <rect x="0" y="36" width="30" height="15" rx="2" fill="#0ea5e9"/>
      <text x="15" y="60" text-anchor="middle" fill="#67e8f9" font-size="10">⋮</text>
      <rect x="0" y="70" width="30" height="15" rx="2" fill="#0ea5e9"/>
    </g>

    <text x="75" y="175" text-anchor="middle" fill="#ffffff" font-size="8">z_c = 1/(H·W) ∑ X_{i,j}</text>
    <text x="75" y="195" text-anchor="middle" fill="#67e8f9" font-size="7.5">Shape: [C, 1, 1]</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="350" y1="155" x2="380" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#attArr)"/>

  <!-- Step 3: MLP Gating (Excitation: Conv -> ReLU -> Conv -> Sigmoid) -->
  <g transform="translate(380, 50)" font-family="monospace">
    <rect width="180" height="210" rx="8" fill="url(#exGrad)" stroke="#818cf8" stroke-width="1.2"/>
    <text x="90" y="25" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="bold">2. Excitation Step</text>
    <text x="90" y="42" text-anchor="middle" fill="#e0e7ff" font-size="7.5">Two-Layer MLP &amp; Sigmoid</text>

    <!-- Layers -->
    <rect x="20" y="60"  width="140" height="24" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="90" y="75" text-anchor="middle" fill="#c7d2fe" font-size="7.5">Dense 1 (Reduction r=16)</text>

    <rect x="20" y="92"  width="140" height="20" rx="4" fill="#1e1b4b"/>
    <text x="90" y="105" text-anchor="middle" fill="#a5b4fc" font-size="7.5">ReLU Non-Linearity</text>

    <rect x="20" y="120" width="140" height="24" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="90" y="135" text-anchor="middle" fill="#c7d2fe" font-size="7.5">Dense 2 (Expand to C)</text>

    <rect x="20" y="152" width="140" height="20" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="165" text-anchor="middle" fill="#34d399" font-size="7.5" font-weight="bold">σ (Sigmoid Gating ∈ [0,1])</text>

    <text x="90" y="195" text-anchor="middle" fill="#a78bfa" font-size="7.5">s = σ(W₂ · δ(W₁ · z))</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="560" y1="155" x2="590" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#attArr)"/>

  <!-- Step 4: Channel Recalibration (Multiply) -->
  <g transform="translate(590, 50)" font-family="monospace">
    <rect width="240" height="210" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.4"/>
    <text x="120" y="25" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="bold">3. Scale &amp; Rescaling</text>
    <text x="120" y="42" text-anchor="middle" fill="#86efac" font-size="7.5">X̃_c = s_c · X_c (Hadamard)</text>

    <!-- Weighted Channels bars -->
    <g transform="translate(25, 60)">
      <!-- Band 8 (NIR) - Boosted -->
      <rect x="0" y="0"  width="150" height="18" rx="3" fill="#22c55e"/>
      <text x="160" y="13" fill="#4ade80" font-size="8" font-weight="bold">0.96 (NIR Boosted)</text>

      <!-- Band 4 (Red) - Suppressed -->
      <rect x="0" y="24" width="60" height="18" rx="3" fill="#065f46"/>
      <text x="160" y="37" fill="#6ee7b7" font-size="8">0.38 (Suppressed)</text>

      <!-- Band 3 (Green) - Modest -->
      <rect x="0" y="48" width="95" height="18" rx="3" fill="#15803d"/>
      <text x="160" y="61" fill="#4ade80" font-size="8">0.62 (Moderate)</text>

      <!-- Band 11 (SWIR) - High -->
      <rect x="0" y="72" width="135" height="18" rx="3" fill="#22c55e"/>
      <text x="160" y="85" fill="#4ade80" font-size="8" font-weight="bold">0.88 (SWIR High)</text>
    </g>

    <text x="120" y="180" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold">Output Feature Maps</text>
    <text x="120" y="196" text-anchor="middle" fill="#10b981" font-size="7.5">✓ Boosts informative bands automatically</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="430" y="300" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    Residual Channel Attention allows PSISRNet to adaptively emphasize spectral bands with high signal variance (NIR, SWIR) over redundant visual channels.
  </text>
</svg>
