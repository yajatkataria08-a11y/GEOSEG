  <!-- Right: Metrics Cards Panel -->
  <g transform="translate(500, 60)" font-family="monospace">
    <!-- Overall Accuracy -->
    <rect width="320" height="60" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="20" y="28" fill="#94a3b8" font-size="9.5">Overall Accuracy (OA)</text>
    <text x="20" y="48" fill="#22d3ee" font-size="20" font-weight="bold">92.4%</text>
    <text x="180" y="48" fill="#10b981" font-size="10">+6.1% over RGB U-Net</text>

    <!-- Mean IoU -->
    <rect y="72" width="320" height="60" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="20" y="100" fill="#94a3b8" font-size="9.5">Mean IoU (mIoU)</text>
    <text x="20" y="120" fill="#818cf8" font-size="20" font-weight="bold">84.7%</text>
    <text x="180" y="120" fill="#10b981" font-size="10">Compound Dice + CE Loss</text>

    <!-- Cohen's Kappa -->
    <rect y="144" width="320" height="60" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="20" y="172" fill="#94a3b8" font-size="9.5">Cohen's Kappa Coefficient (κ)</text>
    <text x="20" y="192" fill="#34d399" font-size="20" font-weight="bold">0.894</text>
    <text x="180" y="192" fill="#34d399" font-size="10">Near-Perfect Agreement</text>

    <!-- Mean F1 Score -->
    <rect y="216" width="320" height="42" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="242" fill="#94a3b8" font-size="9.5">Macro F1 Score:</text>
    <text x="135" y="242" fill="#f59e0b" font-size="11" font-weight="bold">0.918</text>
    <text x="200" y="242" fill="#64748b" font-size="9">16-Channel Tensor</text>
  </g>

  <!-- Y-Axis True Label Indicator -->
  <text x="45" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee" font-weight="bold" transform="rotate(-90 45 195)">
    GROUND TRUTH CLASS
  </text>

  <!-- Bottom subtitle -->
  <text x="430" y="360" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    Evaluated across 1,200 held-out ESA WorldCover validation tiles with 10-meter ground sampling distance.
  </text>
</svg>
