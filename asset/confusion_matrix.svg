<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380">
  <defs>
    <style>
      @keyframes cellPop { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
      @keyframes heatGlow{ 0%,100%{stroke-opacity:.3} 50%{stroke-opacity:.9} }
    </style>
  </defs>

  <rect width="860" height="380" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🎯 EMPIRICAL EVALUATION: MULTISPECTRAL LAND COVER CONFUSION MATRIX (mIoU: 84.7%)
  </text>

  <!-- Left: Confusion Matrix Grid (6 classes: Forest, Water, Built-up, Cropland, Grassland, Bareland) -->
  <!-- Start X: 140, Start Y: 60, Cell: 55x42 -->
  <g font-family="monospace" font-size="8.5">
    <!-- Predicted Labels Header -->
    <text x="305" y="48" text-anchor="middle" fill="#22d3ee" font-weight="bold">PREDICTED LAND COVER CLASS</text>

    <!-- Column labels -->
    <text x="167" y="62" text-anchor="middle" fill="#94a3b8">Forest</text>
    <text x="222" y="62" text-anchor="middle" fill="#94a3b8">Water</text>
    <text x="277" y="62" text-anchor="middle" fill="#94a3b8">Built</text>
    <text x="332" y="62" text-anchor="middle" fill="#94a3b8">Crop</text>
    <text x="387" y="62" text-anchor="middle" fill="#94a3b8">Grass</text>
    <text x="442" y="62" text-anchor="middle" fill="#94a3b8">Bare</text>

    <!-- Row 1: True Forest -->
    <text x="130" y="92" text-anchor="end" fill="#94a3b8">Forest</text>
    <rect x="140" y="72" width="55" height="35" fill="#15803d" opacity="0.95" rx="4" stroke="#4ade80" stroke-width="1" style="animation:cellPop .4s ease-out .1s both"/>
    <text x="167" y="93" text-anchor="middle" fill="#ffffff" font-weight="bold">94.2%</text>

    <rect x="195" y="72" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="222" y="93" text-anchor="middle" fill="#64748b">0.4%</text>

    <rect x="250" y="72" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="277" y="93" text-anchor="middle" fill="#64748b">0.8%</text>

    <rect x="305" y="72" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="332" y="93" text-anchor="middle" fill="#64748b">1.8%</text>

    <rect x="360" y="72" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="387" y="93" text-anchor="middle" fill="#64748b">2.5%</text>

    <rect x="415" y="72" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="442" y="93" text-anchor="middle" fill="#64748b">0.3%</text>

    <!-- Row 2: True Water -->
    <text x="130" y="132" text-anchor="end" fill="#94a3b8">Water</text>
    <rect x="140" y="112" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="167" y="133" text-anchor="middle" fill="#64748b">0.2%</text>

    <rect x="195" y="112" width="55" height="35" fill="#0284c7" opacity="0.95" rx="4" stroke="#38bdf8" stroke-width="1" style="animation:cellPop .4s ease-out .2s both"/>
    <text x="222" y="133" text-anchor="middle" fill="#ffffff" font-weight="bold">97.8%</text>

    <rect x="250" y="112" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="277" y="133" text-anchor="middle" fill="#64748b">0.5%</text>

    <rect x="305" y="112" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="332" y="133" text-anchor="middle" fill="#64748b">0.3%</text>

    <rect x="360" y="112" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="387" y="133" text-anchor="middle" fill="#64748b">0.6%</text>

    <rect x="415" y="112" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="442" y="133" text-anchor="middle" fill="#64748b">0.6%</text>

    <!-- Row 3: True Built-up -->
    <text x="130" y="172" text-anchor="end" fill="#94a3b8">Built</text>
    <rect x="140" y="152" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="167" y="173" text-anchor="middle" fill="#64748b">0.4%</text>

    <rect x="195" y="152" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="222" y="173" text-anchor="middle" fill="#64748b">0.2%</text>

    <rect x="250" y="152" width="55" height="35" fill="#b91c1c" opacity="0.95" rx="4" stroke="#f87171" stroke-width="1" style="animation:cellPop .4s ease-out .3s both"/>
    <text x="277" y="173" text-anchor="middle" fill="#ffffff" font-weight="bold">91.4%</text>

    <rect x="305" y="152" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="332" y="173" text-anchor="middle" fill="#64748b">1.6%</text>

    <rect x="360" y="152" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="387" y="173" text-anchor="middle" fill="#64748b">1.2%</text>

    <rect x="415" y="152" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="442" y="173" text-anchor="middle" fill="#64748b">5.2%</text>

    <!-- Row 4: True Cropland -->
    <text x="130" y="212" text-anchor="end" fill="#94a3b8">Crop</text>
    <rect x="140" y="192" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
