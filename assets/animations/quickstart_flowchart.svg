<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220">
  <defs>
    <style>
      @keyframes flowPipe { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
      @keyframes pipePulse{ 0%,100%{r:3.5} 50%{r:6;fill:#22d3ee} }
    </style>
    <marker id="pipeArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#22d3ee"/></marker>
    <linearGradient id="pGrad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>

  <rect width="860" height="220" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🚀 END-TO-END DATA PROCESSING &amp; INFERENCE PIPELINE
  </text>

  <!-- Step 1: Raw Data Ingestion -->
  <g transform="translate(25, 45)" font-family="monospace">
    <rect width="180" height="135" rx="8" fill="url(#pGrad1)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="180" height="24" rx="8" fill="#0369a1"/>
    <text x="90" y="16" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="bold">1. Ingest L2A Raster</text>
    <text x="90" y="44" text-anchor="middle" fill="#38bdf8" font-size="16">🛰️</text>
    <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="8.5" font-weight="bold">Sentinel-2 MSI Cube</text>
    <text x="90" y="82" text-anchor="middle" fill="#64748b" font-size="7.5">13 BOA Surface Bands</text>
    <text x="90" y="96" text-anchor="middle" fill="#64748b" font-size="7.5">Cloud masking (SCL/QA)</text>
    <text x="90" y="118" text-anchor="middle" fill="#0284c7" font-size="7.5" font-weight="bold">Format: 16-bit GeoTIFF</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="205" y1="112" x2="235" y2="112" stroke="#22d3ee" stroke-width="2" marker-end="url(#pipeArr)" stroke-dasharray="6,3" style="animation:flowPipe 1s linear infinite"/>

  <!-- Step 2: C++ Tile Manager & SIMD -->
  <g transform="translate(235, 45)" font-family="monospace">
    <rect width="180" height="135" rx="8" fill="url(#pGrad1)" stroke="#818cf8" stroke-width="1.2"/>
    <rect width="180" height="24" rx="8" fill="#4338ca"/>
    <text x="90" y="16" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="bold">2. Native C++ Engine</text>
    <text x="90" y="44" text-anchor="middle" fill="#818cf8" font-size="16">⚙️</text>
    <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="8.5" font-weight="bold">SIMD Tile Slicing</text>
    <text x="90" y="82" text-anchor="middle" fill="#64748b" font-size="7.5">AVX2 BandMath NDVI/W/B</text>
    <text x="90" y="96" text-anchor="middle" fill="#64748b" font-size="7.5">Zero-copy RAM buffers</text>
    <text x="90" y="118" text-anchor="middle" fill="#818cf8" font-size="7.5" font-weight="bold">Output: 16-ch float32</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="415" y1="112" x2="445" y2="112" stroke="#22d3ee" stroke-width="2" marker-end="url(#pipeArr)" stroke-dasharray="6,3" style="animation:flowPipe 1s linear infinite;animation-delay:.3s"/>

  <!-- Step 3: Cascading PSISRNet -->
  <g transform="translate(445, 45)" font-family="monospace">
    <rect width="180" height="135" rx="8" fill="url(#pGrad1)" stroke="#22d3ee" stroke-width="1.2"/>
    <rect width="180" height="24" rx="8" fill="#0891b2"/>
    <text x="90" y="16" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="bold">3. Deep Learning Core</text>
    <text x="90" y="44" text-anchor="middle" fill="#22d3ee" font-size="16">🧠</text>
    <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="8.5" font-weight="bold">PSISRNet + U-Net</text>
    <text x="90" y="82" text-anchor="middle" fill="#64748b" font-size="7.5">2× → 4× → 8× UBCF</text>
    <text x="90" y="96" text-anchor="middle" fill="#64748b" font-size="7.5">11-class WorldCover</text>
    <text x="90" y="118" text-anchor="middle" fill="#22d3ee" font-size="7.5" font-weight="bold">PSNR: 38.47 dB · SOTA</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="625" y1="112" x2="655" y2="112" stroke="#22d3ee" stroke-width="2" marker-end="url(#pipeArr)" stroke-dasharray="6,3" style="animation:flowPipe 1s linear infinite;animation-delay:.6s"/>

  <!-- Step 4: Interactive Cockpit -->
  <g transform="translate(655, 45)" font-family="monospace">
    <rect width="180" height="135" rx="8" fill="url(#pGrad1)" stroke="#10b981" stroke-width="1.2"/>
    <rect width="180" height="24" rx="8" fill="#059669"/>
    <text x="90" y="16" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="bold">4. Web Cockpit</text>
    <text x="90" y="44" text-anchor="middle" fill="#10b981" font-size="16">💻</text>
    <text x="90" y="68" text-anchor="middle" fill="#e2e8f0" font-size="8.5" font-weight="bold">FastAPI + React 18</text>
    <text x="90" y="82" text-anchor="middle" fill="#64748b" font-size="7.5">3D NASA Blue Marble</text>
    <text x="90" y="96" text-anchor="middle" fill="#64748b" font-size="7.5">Live slider comparison</text>
    <text x="90" y="118" text-anchor="middle" fill="#10b981" font-size="7.5" font-weight="bold">Port 5173 / Port 8000</text>
  </g>

  <!-- Bottom text -->
  <text x="430" y="200" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    Fully asynchronous execution pipeline: from multi-gigabyte raw GeoTIFF ingestion to real-time interactive browser visualization.
  </text>
</svg>
