<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c1936"/>
    </linearGradient>
    <linearGradient id="nvgreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="cyanbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purplebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="240" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <g transform="translate(24, 20)">
    <!-- NVIDIA Badge -->
    <rect width="130" height="26" rx="6" fill="#14532d" stroke="#76b900" stroke-width="1"/>
    <circle cx="16" cy="13" r="5" fill="#76b900">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="17" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#a3e635">RTX 5050 CUDA</text>

    <!-- Header Title -->
    <text x="145" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700" fill="#f8fafc">Hardware Acceleration &amp; Training Throughput</text>
    
    <!-- FP16 AMP Pill -->
    <rect x="740" y="0" width="112" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="796" y="17" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#c7d2fe">FP16 AMP Active</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="60" x2="876" y2="60" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left Column: Speedup Comparison Bars -->
  <g transform="translate(24, 75)">
    <text x="0" y="16" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#94a3b8">Epoch Execution Latency (Lower is Better)</text>

    <!-- CPU Bar -->
    <text x="0" y="44" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#cbd5e1">AMD CPU (Reference)</text>
    <rect x="180" y="32" width="300" height="16" rx="4" fill="#334155"/>
    <text x="490" y="44" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#94a3b8">~75.0 s / ep</text>

    <!-- GPU Bar -->
    <text x="0" y="76" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#76b900">RTX 5050 Laptop GPU</text>
    <rect x="180" y="64" width="300" height="16" rx="4" fill="#1e293b"/>
    <rect x="180" y="64" width="8" height="16" rx="4" fill="url(#nvgreen)" filter="url(#glow)">
      <animate attributeName="width" values="0;12;8" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="202" y="76" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#a3e635">1.1 s / ep  (68× Faster ⚡)</text>

    <!-- VRAM Stats Row -->
    <g transform="translate(0, 105)">
      <rect width="470" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#64748b">VRAM: </text>
      <text x="56" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#38bdf8">187 MB alloc</text>
      <text x="145" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#64748b">|</text>
      <text x="160" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#c084fc">2.27 GB peak</text>
      <text x="250" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#64748b">|</text>
      <text x="265" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80">8.0 GB total</text>
      <text x="375" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15">CUDA 12.8</text>
    </g>
  </g>

  <!-- Right Column: 4-Model Trained Status Cards -->
  <g transform="translate(535, 75)">
    <text x="0" y="16" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#94a3b8">50-Epoch Verified Checkpoints</text>

    <!-- Model 1: PSISRNet -->
    <g transform="translate(0, 28)">
      <rect width="340" height="28" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
      <text x="26" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#e0f2fe">PSISRNet (8× SR)</text>
      <text x="240" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#38bdf8">38.47 dB</text>
      <text x="300" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#64748b">100ep</text>
    </g>

    <!-- Model 2: ColNet -->
    <g transform="translate(0, 62)">
      <rect width="340" height="28" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3.5" fill="#a855f7"/>
      <text x="26" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#f3e8ff">ColNet (Joint Multi-Task)</text>
      <text x="240" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#c084fc">Val 4.07</text>
      <text x="300" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#64748b">50ep</text>
    </g>

    <!-- Model 3: UNetFormer & FarSeg -->
    <g transform="translate(0, 96)">
      <rect width="340" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3.5" fill="#34d399"/>
      <text x="26" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#ecfdf5">UNetFormer &amp; FarSeg</text>
      <text x="240" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#34d399">Val 3.40</text>
      <text x="300" y="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#64748b">50ep</text>
    </g>
  </g>

  <!-- Animated Scanline Accent -->
  <rect x="0" y="0" width="900" height="2" fill="#76b900" opacity="0">
    <animate attributeName="y" values="0;240;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
