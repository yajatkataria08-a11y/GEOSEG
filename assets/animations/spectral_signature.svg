<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380">
  <defs>
    <style>
      @keyframes drawVeg  { from{stroke-dashoffset:1200} to{stroke-dashoffset:0} }
      @keyframes drawWater{ from{stroke-dashoffset:1200} to{stroke-dashoffset:0} }
      @keyframes drawSoil { from{stroke-dashoffset:1200} to{stroke-dashoffset:0} }
      @keyframes drawUrban{ from{stroke-dashoffset:1200} to{stroke-dashoffset:0} }
      @keyframes sweepWL  { 0%{x1:100;x2:100;opacity:0} 10%{opacity:.7} 90%{opacity:.7} 100%{x1:800;x2:800;opacity:0} }
      @keyframes pulseDot { 0%,100%{r:4;opacity:1} 50%{r:6.5;opacity:.6} }
      @keyframes textFade { from{opacity:0} to{opacity:1} }
    </style>
    <linearGradient id="vegGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/><stop offset="35%" stop-color="#16a34a"/><stop offset="55%" stop-color="#4ade80"/><stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="40%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="urbanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/><stop offset="60%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="860" height="380" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🌿 OPTICAL PHYSICS: SPECTRAL REFLECTANCE SIGNATURES ACROSS SENTINEL-2 BANDS
  </text>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="90" y1="50"  x2="800" y2="50"/>
    <line x1="90" y1="105" x2="800" y2="105"/>
    <line x1="90" y1="160" x2="800" y2="160"/>
    <line x1="90" y1="215" x2="800" y2="215"/>
    <line x1="90" y1="270" x2="800" y2="270"/>
    <line x1="90" y1="320" x2="800" y2="320" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Y-Axis (Reflectance %) -->
  <line x1="90" y1="50" x2="90" y2="320" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="55"  text-anchor="end" font-family="monospace" font-size="9" fill="#64748b">60%</text>
  <text x="80" y="110" text-anchor="end" font-family="monospace" font-size="9" fill="#64748b">50%</text>
  <text x="80" y="165" text-anchor="end" font-family="monospace" font-size="9" fill="#64748b">40%</text>
  <text x="80" y="220" text-anchor="end" font-family="monospace" font-size="9" fill="#64748b">30%</text>
  <text x="80" y="275" text-anchor="end" font-family="monospace" font-size="9" fill="#64748b">20%</text>
  <text x="80" y="324" text-anchor="end" font-family="monospace" font-size="9" fill="#64748b">0%</text>
  <text x="35" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8" transform="rotate(-90 35 185)">Surface Reflectance (ρ)</text>

  <!-- Spectral Regions Shading at Bottom -->
  <rect x="90"  y="320" width="130" height="15" fill="#3b82f6" opacity="0.15"/>
  <text x="155" y="331" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#60a5fa">VISIBLE (400-700nm)</text>

  <rect x="220" y="320" width="120" height="15" fill="#22c55e" opacity="0.15"/>
  <text x="280" y="331" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#4ade80">RED EDGE (700-780nm)</text>

  <rect x="340" y="320" width="180" height="15" fill="#8b5cf6" opacity="0.15"/>
  <text x="430" y="331" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#a78bfa">NIR (780-1000nm)</text>

  <rect x="520" y="320" width="280" height="15" fill="#f59e0b" opacity="0.15"/>
  <text x="660" y="331" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#fbbf24">SWIR (1000-2200nm)</text>

  <!-- Sentinel-2 Band Ticks along X -->
  <!-- B1:105, B2:130, B3:160, B4:195, B5:235, B6:265, B7:295, B8:370, B8A:400, B9:460, B11:630, B12:750 -->
  <g font-family="monospace" font-size="7.5" fill="#64748b" text-anchor="middle">
    <text x="105" y="345">B01</text>
    <text x="130" y="345">B02</text>
    <text x="160" y="345">B03</text>
    <text x="195" y="345">B04</text>
    <text x="235" y="345" fill="#4ade80" font-weight="bold">B05</text>
    <text x="265" y="345" fill="#4ade80">B06</text>
    <text x="295" y="345" fill="#4ade80">B07</text>
    <text x="370" y="345" fill="#a78bfa" font-weight="bold">B08</text>
    <text x="400" y="345">B8A</text>
    <text x="630" y="345">B11</text>
    <text x="750" y="345">B12</text>
  </g>

  <!-- 1. HEALTHY VEGETATION CURVE (Famous Red Edge Cliff & NIR Plateau) -->
  <!-- Low in Blue(B2=130, y=300), Green bump(B3=160, y=280), Red absorption(B4=195, y=305), Steep Red Edge(B5=235, y=200 -> B7=295, y=100), NIR plateau(B8=370, y=85), SWIR drops(B11=630, y=160, B12=750, y=240) -->
  <path d="M 95,302 Q 130,305 160,280 T 195,305 C 220,290 235,210 270,140 C 300,95 340,85 410,85 C 480,90 540,110 630,165 C 690,200 730,230 780,245"
        fill="none" stroke="url(#vegGrad)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="1200"
        style="animation:drawVeg 2.2s ease-out forwards"/>

  <!-- Red Edge Annotation Box -->
  <rect x="220" y="115" width="105" height="42" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1" opacity="0.9"/>
  <text x="272" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ade80" font-weight="bold">STEEP RED-EDGE</text>
  <text x="272" y="148" text-anchor="middle" font-family="monospace" font-size="7" fill="#86efac">Chlorophyll Jump Δ=45%</text>

  <!-- 2. CLEAR WATER BODY CURVE (Absorbs NIR & SWIR completely) -->
  <!-- Peak in Blue (B2=130, y=260), down in Red (B4=195, y=300), 0 in NIR (B8=370, y=318), 0 in SWIR -->
  <path d="M 95,255 Q 130,250 160,265 T 195,295 C 240,312 300,318 370,318 C 450,318 630,318 780,318"
        fill="none" stroke="url(#waterGrad)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="1200"
        style="animation:drawWater 2s ease-out .4s forwards"/>

  <!-- 3. BARE SOIL / DRY SAND (Monotonically rising) -->
  <path d="M 95,285 Q 160,270 230,250 T 370,205 C 470,175 550,155 630,135 C 700,120 740,125 780,130"
        fill="none" stroke="url(#soilGrad)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="1200"
        style="animation:drawSoil 2.4s ease-out .6s forwards"/>

  <!-- 4. URBAN BUILT-UP / CONCRETE (Relatively flat, gentle rise) -->
  <path d="M 95,245 Q 160,230 230,215 T 370,200 C 470,190 550,185 630,175 C 700,170 740,170 780,165"
        fill="none" stroke="url(#urbanGrad)" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="1200"
        style="animation:drawUrban 2.5s ease-out .8s forwards"/>

  <!-- Scanning Spectral Wavelength Line -->
  <line y1="50" y2="320" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,2" style="animation:sweepWL 5s ease-in-out 3s infinite"/>

  <!-- Dots at key bands -->
  <circle cx="370" cy="85" r="4.5" fill="#4ade80" style="animation:pulseDot 2s infinite"/>
  <circle cx="195" cy="305" r="4" fill="#ef4444"/>
  <circle cx="130" cy="250" r="4" fill="#0284c7"/>

  <!-- Legend -->
  <g font-family="monospace" font-size="8.5" fill="#94a3b8">
    <rect x="120" y="360" width="12" height="8" rx="2" fill="#22c55e"/>
    <text x="138" y="367">Dense Forest / Canopy (NDVI &gt; 0.75)</text>

    <rect x="340" y="360" width="12" height="8" rx="2" fill="#0ea5e9"/>
    <text x="358" y="367">Deep Open Water (NDWI &gt; 0.50)</text>

    <rect x="520" y="360" width="12" height="8" rx="2" fill="#f59e0b"/>
    <text x="538" y="367">Dry Soil / Sand Mineral</text>

    <rect x="680" y="360" width="12" height="8" rx="2" fill="#94a3b8"/>
    <text x="698" y="367">Urban Concrete / Asphalt</text>
  </g>
</svg>
