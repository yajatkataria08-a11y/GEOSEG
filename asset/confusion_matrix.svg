    <rect x="140" y="272" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="167" y="293" text-anchor="middle" fill="#64748b">0.4%</text>

    <rect x="195" y="272" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
    <text x="222" y="293" text-anchor="middle" fill="#64748b">0.3%</text>

    <rect x="250" y="272" width="55" height="35" fill="#1e293b" opacity="0.6" rx="4"/>
