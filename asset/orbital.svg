<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360">
  <defs>
    <style>
      @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:1} }
      @keyframes orbitA  { from{offset-distance:0%} to{offset-distance:100%} }
      @keyframes orbitB  { from{offset-distance:50%} to{offset-distance:150%} }
      @keyframes beamPulse { 0%,100%{opacity:.2;stroke-width:1} 50%{opacity:.8;stroke-width:2} }
      @keyframes bandFill { from{width:0} to{width:var(--target-w)} }
      @keyframes earthSpin { 0%{filter:drop-shadow(0 0 10px #3b82f6)} 50%{filter:drop-shadow(0 0 22px #60a5fa)} 100%{filter:drop-shadow(0 0 10px #3b82f6)} }
      @keyframes scanSweep { 0%{y:60;opacity:0} 10%{opacity:.6} 90%{opacity:.6} 100%{y:330;opacity:0} }
    </style>
    <radialGradient id="earthGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="25%"  stop-color="#1d4ed8"/>
      <stop offset="65%"  stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="glowSun">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="360" fill="#020617" rx="12"/>

  <!-- Star field -->
  <g fill="white">
    <circle cx="30"  cy="25"  r="1.2" style="animation:twinkle 2.2s infinite"/>
    <circle cx="110" cy="50"  r="1"   style="animation:twinkle 3.1s infinite"/>
    <circle cx="180" cy="18"  r="1.4" fill="#93c5fd" style="animation:twinkle 1.7s infinite"/>
    <circle cx="260" cy="45"  r="0.9" style="animation:twinkle 2.8s infinite"/>
    <circle cx="350" cy="15"  r="1.2" fill="#c4b5fd" style="animation:twinkle 4s infinite"/>
    <circle cx="50"  cy="310" r="1.1" style="animation:twinkle 2.5s infinite"/>
    <circle cx="130" cy="335" r="0.8" style="animation:twinkle 3.3s infinite"/>
    <circle cx="210" cy="320" r="1.3" fill="#6ee7b7" style="animation:twinkle 1.9s infinite"/>
  </g>

  <!-- Sun in upper right corner -->
  <g filter="url(#glowSun)">
    <circle cx="810" cy="50" r="28" fill="url(#sunGrad)"/>
    <circle cx="810" cy="50" r="38" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="32;42;32" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Earth with continents -->
  <g style="animation:earthSpin 4s ease-in-out infinite">
    <circle cx="180" cy="180" r="85" fill="url(#earthGrad)"/>
    <ellipse cx="160" cy="165" rx="32" ry="24" fill="#15803d" opacity="0.85" transform="rotate(-15,160,165)"/>
    <ellipse cx="205" cy="180" rx="22" ry="16" fill="#166534" opacity="0.8" transform="rotate(10,205,180)"/>
    <ellipse cx="145" cy="195" rx="16" ry="12" fill="#14532d" opacity="0.75"/>
    <ellipse cx="180" cy="100" rx="38" ry="10" fill="white" opacity="0.45"/>
    <ellipse cx="180" cy="260" rx="34" ry="9"  fill="white" opacity="0.35"/>
    <!-- Atmosphere halo -->
    <circle cx="180" cy="180" r="92" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.35"/>
  </g>

  <!-- Orbit Path 1 (Sentinel-2A) -->
  <ellipse cx="180" cy="180" rx="145" ry="42" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.45"/>
  <!-- Orbit Path 2 (Sentinel-2B) -->
  <ellipse cx="180" cy="180" rx="165" ry="54" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.35"/>

  <!-- Satellite Sentinel-2A -->
  <g style="offset-path:path('M 35,180 A 145,42 0 1,0 325,180 A 145,42 0 1,0 35,180 Z');animation:orbitA 9s linear infinite;offset-rotate:auto">
    <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#f8fafc"/>
    <rect x="-17" y="-2.5" width="7" height="5" rx="1" fill="#fbbf24"/>
    <rect x="10"  y="-2.5" width="7" height="5" rx="1" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="2.2" fill="#38bdf8"/>
    <!-- Scanner Beam pointing to Earth -->
    <line x1="0" y1="4" x2="0" y2="28" stroke="#22d3ee" stroke-width="1.5" style="animation:beamPulse 1.2s infinite"/>
    <text x="14" y="3" font-family="monospace" font-size="7.5" fill="#22d3ee" font-weight="bold">S-2A</text>
  </g>

  <!-- Satellite Sentinel-2B (offset by 180 degrees) -->
  <g style="offset-path:path('M 15,180 A 165,54 0 1,0 345,180 A 165,54 0 1,0 15,180 Z');animation:orbitB 9s linear infinite;offset-rotate:auto">
    <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#e0e7ff"/>
    <rect x="-17" y="-2.5" width="7" height="5" rx="1" fill="#f59e0b"/>
    <rect x="10"  y="-2.5" width="7" height="5" rx="1" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="2.2" fill="#818cf8"/>
    <line x1="0" y1="4" x2="0" y2="28" stroke="#818cf8" stroke-width="1.5" style="animation:beamPulse 1.2s infinite;animation-delay:.6s"/>
    <text x="14" y="3" font-family="monospace" font-size="7.5" fill="#818cf8" font-weight="bold">S-2B</text>
  </g>

  <!-- 13-Band Spectral Matrix Panel -->
  <rect x="390" y="30" width="455" height="305" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="617" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8" font-weight="bold">
    🛰️ COPERNICUS SENTINEL-2 MSI — 13 SPECTRAL BANDS
  </text>

  <!-- Bands Listing -->
  <g font-family="monospace" font-size="8">
    <!-- B01 -->
    <rect x="410" y="68" width="80" height="15" rx="4" fill="#93c5fd" opacity="0.85"/>
    <text x="498" y="79" fill="#94a3b8">B01 (443nm, 60m) Coastal Aerosol</text>

    <!-- B02 -->
    <rect x="410" y="87" width="140" height="15" rx="4" fill="#60a5fa" opacity="0.9"/>
    <text x="558" y="98" fill="#60a5fa" font-weight="bold">B02 (490nm, 10m) Blue (Visual)</text>

    <!-- B03 -->
    <rect x="410" y="106" width="140" height="15" rx="4" fill="#4ade80" opacity="0.9"/>
    <text x="558" y="117" fill="#4ade80" font-weight="bold">B03 (560nm, 10m) Green (Visual)</text>

    <!-- B04 -->
    <rect x="410" y="125" width="140" height="15" rx="4" fill="#ef4444" opacity="0.9"/>
    <text x="558" y="136" fill="#ef4444" font-weight="bold">B04 (665nm, 10m) Red (Visual)</text>

    <!-- B05 -->
    <rect x="410" y="144" width="95" height="15" rx="4" fill="#bef264" opacity="0.85"/>
    <text x="513" y="155" fill="#94a3b8">B05 (705nm, 20m) Red Edge 1</text>

    <!-- B06 -->
    <rect x="410" y="163" width="95" height="15" rx="4" fill="#a3e635" opacity="0.85"/>
    <text x="513" y="174" fill="#94a3b8">B06 (740nm, 20m) Red Edge 2</text>

    <!-- B07 -->
    <rect x="410" y="182" width="95" height="15" rx="4" fill="#84cc16" opacity="0.85"/>
    <text x="513" y="193" fill="#94a3b8">B07 (783nm, 20m) Red Edge 3</text>

    <!-- B08 -->
    <rect x="410" y="201" width="140" height="15" rx="4" fill="#8b5cf6" opacity="0.9"/>
    <text x="558" y="212" fill="#8b5cf6" font-weight="bold">B08 (842nm, 10m) NIR Broad (Vegetation)</text>

    <!-- B8A -->
    <rect x="410" y="220" width="95" height="15" rx="4" fill="#7c3aed" opacity="0.85"/>
    <text x="513" y="231" fill="#94a3b8">B8A (865nm, 20m) NIR Narrow</text>

    <!-- B09 -->
    <rect x="410" y="239" width="60" height="15" rx="4" fill="#3b82f6" opacity="0.75"/>
    <text x="478" y="250" fill="#94a3b8">B09 (945nm, 60m) Water Vapor</text>

    <!-- B10 -->
    <rect x="410" y="258" width="60" height="15" rx="4" fill="#64748b" opacity="0.75"/>
    <text x="478" y="269" fill="#94a3b8">B10 (1375nm, 60m) Cirrus Cloud</text>

    <!-- B11 -->
    <rect x="410" y="277" width="95" height="15" rx="4" fill="#d97706" opacity="0.85"/>
    <text x="513" y="288" fill="#94a3b8">B11 (1610nm, 20m) SWIR-1 (Moisture)</text>

    <!-- B12 -->
    <rect x="410" y="296" width="95" height="15" rx="4" fill="#b45309" opacity="0.85"/>
    <text x="513" y="307" fill="#94a3b8">B12 (2190nm, 20m) SWIR-2 (Geology)</text>
  </g>

  <!-- Laser scan sweep -->
  <rect x="390" y="60" width="455" height="3" fill="#22d3ee" opacity="0.6" style="animation:scanSweep 4s ease-in-out infinite"/>
</svg>
