<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340">
  <defs>
    <style>
      @keyframes gridPulse { 0%,100%{opacity:.3} 50%{opacity:1} }
      @keyframes beamDilate{ 0%,100%{stroke-width:1;opacity:.4} 50%{stroke-width:2.5;opacity:1} }
    </style>
    <linearGradient id="rate1G" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="rate2G" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="rate4G" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#052e16"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  </defs>

  <rect width="860" height="340" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🔬 DILATED CONVOLUTIONS &amp; UBCF RECEPTIVE FIELD BLIND-SPOT ELIMINATION
  </text>

  <!-- PANEL 1: Standard Conv (Rate d = 1) -->
  <g transform="translate(30, 45)" font-family="monospace">
    <rect width="240" height="245" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="120" y="25" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">Standard Conv (Rate d = 1)</text>
    <text x="120" y="40" text-anchor="middle" fill="#64748b" font-size="8">3×3 Filter · RF = 3×3 pixels</text>

    <!-- 7x7 Grid Representation -->
    <g transform="translate(45, 55)">
      <!-- Background cells -->
      <g fill="#1e293b" stroke="#334155" stroke-width="0.5">
        <!-- 7 rows of 7 cells (size 20, gap 2) -->
        <rect x="0" y="0" width="150" height="150" rx="4" fill="#090d16"/>
      </g>
      <!-- 3x3 active kernel (centered at cell 3,3) -->
      <!-- Center is at 75,75. 3x3 spans 35 to 115 -->
      <rect x="42" y="42" width="66" height="66" rx="4" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Kernel weight points (9 dots) -->
      <circle cx="53" cy="53" r="4" fill="#38bdf8"/>
      <circle cx="75" cy="53" r="4" fill="#38bdf8"/>
      <circle cx="97" cy="53" r="4" fill="#38bdf8"/>
      <circle cx="53" cy="75" r="4" fill="#38bdf8"/>
      <circle cx="75" cy="75" r="5" fill="#facc15"/> <!-- Center -->
      <circle cx="97" cy="75" r="4" fill="#38bdf8"/>
      <circle cx="53" cy="97" r="4" fill="#38bdf8"/>
      <circle cx="75" cy="97" r="4" fill="#38bdf8"/>
      <circle cx="97" cy="97" r="4" fill="#38bdf8"/>
    </g>

    <text x="120" y="222" text-anchor="middle" fill="#94a3b8" font-size="8">Receptive Field: Local only</text>
    <text x="120" y="235" text-anchor="middle" fill="#ef4444" font-size="7.5">⚠️ Misses macro urban structures</text>
  </g>

  <!-- PANEL 2: Dilated Conv (Rate d = 2) -->
  <g transform="translate(310, 45)" font-family="monospace">
    <rect width="240" height="245" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="120" y="25" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">Dilated Conv (Rate d = 2)</text>
    <text x="120" y="40" text-anchor="middle" fill="#64748b" font-size="8">3×3 Filter · RF = 7×7 pixels</text>

    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="150" height="150" rx="4" fill="#090d16" stroke="#334155" stroke-width="0.5"/>
      <rect x="20" y="20" width="110" height="110" rx="4" fill="#7c3aed" opacity="0.2" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,2"/>
      <!-- Rate 2 dots (stride of 2) -->
      <circle cx="25" cy="25" r="4" fill="#c084fc"/>
      <circle cx="75" cy="25" r="4" fill="#c084fc"/>
      <circle cx="125" cy="25" r="4" fill="#c084fc"/>
      <circle cx="25" cy="75" r="4" fill="#c084fc"/>
      <circle cx="75" cy="75" r="5" fill="#facc15"/>
      <circle cx="125" cy="75" r="4" fill="#c084fc"/>
      <circle cx="25" cy="125" r="4" fill="#c084fc"/>
      <circle cx="75" cy="125" r="4" fill="#c084fc"/>
      <circle cx="125" cy="125" r="4" fill="#c084fc"/>

      <!-- Connecting rays -->
      <line x1="25" y1="25" x2="125" y2="125" stroke="#a78bfa" stroke-width="0.8" opacity="0.4"/>
      <line x1="25" y1="125" x2="125" y2="25" stroke="#a78bfa" stroke-width="0.8" opacity="0.4"/>
    </g>

    <text x="120" y="222" text-anchor="middle" fill="#94a3b8" font-size="8">Expanded RF without param bloat</text>
    <text x="120" y="235" text-anchor="middle" fill="#f59e0b" font-size="7.5">⚠️ Potential gridding blind spots</text>
  </g>

  <!-- PANEL 3: UBCF Fusion (Eliminates Blind Spots) -->
  <g transform="translate(590, 45)" font-family="monospace">
    <rect width="240" height="245" rx="10" fill="#052e16" stroke="#10b981" stroke-width="1.6"/>
    <text x="120" y="25" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">UBCF Multi-Rate Fusion</text>
    <text x="120" y="40" text-anchor="middle" fill="#86efac" font-size="8">Cascading d=[1,2,4] + Correlation</text>

    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="150" height="150" rx="4" fill="#021a0c" stroke="#10b981" stroke-width="1"/>

      <!-- Multi-scale overlay circles -->
      <circle cx="75" cy="75" r="65" fill="#10b981" opacity="0.12"/>
      <circle cx="75" cy="75" r="45" fill="#10b981" opacity="0.18"/>
      <circle cx="75" cy="75" r="22" fill="#10b981" opacity="0.25"/>

      <!-- Complete non-blind pixel coverage -->
      <g fill="#34d399" opacity="0.85">
        <circle cx="75" cy="75" r="5" fill="#facc15"/>
        <circle cx="53" cy="75" r="3"/><circle cx="97" cy="75" r="3"/>
        <circle cx="75" cy="53" r="3"/><circle cx="75" cy="97" r="3"/>
        <circle cx="53" cy="53" r="3"/><circle cx="97" cy="53" r="3"/>
        <circle cx="53" cy="97" r="3"/><circle cx="97" cy="97" r="3"/>

        <circle cx="25" cy="25" r="3.5"/><circle cx="75" cy="25" r="3.5"/><circle cx="125" cy="25" r="3.5"/>
        <circle cx="25" cy="75" r="3.5"/><circle cx="125" cy="75" r="3.5"/>
        <circle cx="25" cy="125" r="3.5"/><circle cx="75" cy="125" r="3.5"/><circle cx="125" cy="125" r="3.5"/>
      </g>
    </g>

    <text x="120" y="222" text-anchor="middle" fill="#4ade80" font-size="8" font-weight="bold">Zero Blind Spots · Continuous RF</text>
    <text x="120" y="235" text-anchor="middle" fill="#10b981" font-size="7.5">✓ Suppresses checkerboard artifacts</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="430" y="315" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    UBCF combines multi-rate dilation with sub-pixel convolution shuffle to guarantee mathematical continuity across all magnification stages.
  </text>
</svg>
