<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330">
  <defs>
    <style>
      @keyframes shuffleFlow { 0%{stroke-dashoffset:80} 100%{stroke-dashoffset:0} }
      @keyframes cellGlow    { 0%,100%{stroke-opacity:.4} 50%{stroke-opacity:1} }
    </style>
    <marker id="shufArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#22d3ee"/></marker>
    <linearGradient id="ch1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="ch2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="ch3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="ch4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
  </defs>

  <rect width="860" height="330" fill="#0b0f19" rx="12" stroke="#1e293b" stroke-width="1.5"/>

  <text x="430" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" font-weight="bold">
    🔀 SUB-PIXEL CONVOLUTION (PIXEL SHUFFLE): PERIODIC REARRANGEMENT TENSOR OPERATOR
  </text>

  <!-- Left: Input Multi-Channel Low-Res Feature Map [C * r^2, H, W] -->
  <g transform="translate(40, 50)" font-family="monospace">
    <rect width="280" height="230" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
    <text x="140" y="24" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="bold">Low-Res Multi-Channel Tensor</text>
    <text x="140" y="38" text-anchor="middle" fill="#94a3b8" font-size="8">Shape: [C · r², H, W] = [4, 2, 2]</text>

    <!-- 4 Depth Slices staggered -->
    <!-- Slice 1 (Red: top-left subpixel) -->
    <g transform="translate(30, 55)">
      <rect width="80" height="80" rx="4" fill="url(#ch1)" opacity="0.85" stroke="#f87171" stroke-width="1"/>
      <text x="40" y="45" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">ch 0</text>
      <text x="40" y="62" text-anchor="middle" fill="#fecaca" font-size="7">(0,0)</text>
    </g>

    <!-- Slice 2 (Blue: top-right subpixel) -->
    <g transform="translate(60, 75)">
      <rect width="80" height="80" rx="4" fill="url(#ch2)" opacity="0.85" stroke="#60a5fa" stroke-width="1"/>
      <text x="40" y="45" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">ch 1</text>
      <text x="40" y="62" text-anchor="middle" fill="#bfdbfe" font-size="7">(0,1)</text>
    </g>

    <!-- Slice 3 (Green: bottom-left subpixel) -->
    <g transform="translate(90, 95)">
      <rect width="80" height="80" rx="4" fill="url(#ch3)" opacity="0.85" stroke="#34d399" stroke-width="1"/>
      <text x="40" y="45" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">ch 2</text>
      <text x="40" y="62" text-anchor="middle" fill="#a7f3d0" font-size="7">(1,0)</text>
    </g>

    <!-- Slice 4 (Yellow: bottom-right subpixel) -->
    <g transform="translate(120, 115)">
      <rect width="80" height="80" rx="4" fill="url(#ch4)" opacity="0.9" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="40" y="45" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">ch 3</text>
      <text x="40" y="62" text-anchor="middle" fill="#fef08a" font-size="7">(1,1)</text>
    </g>

    <text x="140" y="215" text-anchor="middle" fill="#64748b" font-size="7.5">r = 2 (2× Magnification factor)</text>
  </g>

  <!-- Center: Periodic Shuffle Operator Equation -->
  <g transform="translate(340, 110)" font-family="monospace">
    <rect width="180" height="110" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" style="animation:cellGlow 2.5s infinite"/>
    <text x="90" y="26" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="bold">PS(T)_{x,y,c} =</text>
    <text x="90" y="46" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">T_{⌊x/r⌋, ⌊y/r⌋, C}</text>
    <text x="90" y="68" text-anchor="middle" fill="#a5b4fc" font-size="7.5">C = c·r² + mod(y,r)·r + mod(x,r)</text>
    <text x="90" y="94" text-anchor="middle" fill="#22d3ee" font-size="8" font-weight="bold">Zero Hallucinations</text>
  </g>

  <!-- Connectors -->
  <line x1="320" y1="165" x2="340" y2="165" stroke="#22d3ee" stroke-width="2" marker-end="url(#shufArr)"/>
  <line x1="520" y1="165" x2="540" y2="165" stroke="#22d3ee" stroke-width="2" marker-end="url(#shufArr)"/>

  <!-- Right: Output High-Resolution Interleaved Spatial Grid [C, H*r, W*r] -->
  <g transform="translate(540, 50)" font-family="monospace">
    <rect width="280" height="230" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.2"/>
    <text x="140" y="24" text-anchor="middle" fill="#4ade80" font-size="9.5" font-weight="bold">High-Res Spatial Image Plane</text>
    <text x="140" y="38" text-anchor="middle" fill="#86efac" font-size="8">Shape: [C, H · r, W · r] = [1, 4, 4]</text>

    <!-- 4x4 Interleaved Mosaic Grid -->
    <g transform="translate(65, 55)">
      <!-- 2x2 macro block 1 -->
      <rect x="0"  y="0"  width="35" height="35" fill="url(#ch1)" stroke="#090d16" stroke-width="1"/>
      <rect x="35" y="0"  width="35" height="35" fill="url(#ch2)" stroke="#090d16" stroke-width="1"/>
      <rect x="0"  y="35" width="35" height="35" fill="url(#ch3)" stroke="#090d16" stroke-width="1"/>
      <rect x="35" y="35" width="35" height="35" fill="url(#ch4)" stroke="#090d16" stroke-width="1"/>

      <!-- 2x2 macro block 2 (right) -->
      <rect x="75"  y="0"  width="35" height="35" fill="url(#ch1)" stroke="#090d16" stroke-width="1"/>
      <rect x="110" y="0"  width="35" height="35" fill="url(#ch2)" stroke="#090d16" stroke-width="1"/>
      <rect x="75"  y="35" width="35" height="35" fill="url(#ch3)" stroke="#090d16" stroke-width="1"/>
      <rect x="110" y="35" width="35" height="35" fill="url(#ch4)" stroke="#090d16" stroke-width="1"/>

      <!-- 2x2 macro block 3 (bottom-left) -->
      <rect x="0"  y="75"  width="35" height="35" fill="url(#ch1)" stroke="#090d16" stroke-width="1"/>
      <rect x="35" y="75"  width="35" height="35" fill="url(#ch2)" stroke="#090d16" stroke-width="1"/>
      <rect x="0"  y="110" width="35" height="35" fill="url(#ch3)" stroke="#090d16" stroke-width="1"/>
      <rect x="35" y="110" width="35" height="35" fill="url(#ch4)" stroke="#090d16" stroke-width="1"/>

      <!-- 2x2 macro block 4 (bottom-right) -->
      <rect x="75"  y="75"  width="35" height="35" fill="url(#ch1)" stroke="#090d16" stroke-width="1"/>
      <rect x="110" y="75"  width="35" height="35" fill="url(#ch2)" stroke="#090d16" stroke-width="1"/>
      <rect x="75"  y="110" width="35" height="35" fill="url(#ch3)" stroke="#090d16" stroke-width="1"/>
      <rect x="110" y="110" width="35" height="35" fill="url(#ch4)" stroke="#090d16" stroke-width="1"/>
    </g>

    <text x="140" y="215" text-anchor="middle" fill="#10b981" font-size="7.5" font-weight="bold">✓ Spatial Dimension Expanded by 4×</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="430" y="310" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#64748b">
    Sub-pixel convolution maps channel redundancy into high-resolution spatial fidelity without deconvolution checkerboard artifacts.
  </text>
</svg>
