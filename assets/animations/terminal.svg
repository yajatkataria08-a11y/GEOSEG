<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410">
  <defs>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes lineFade1 { 0%{opacity:0} 10%{opacity:1} 100%{opacity:1} }
      @keyframes lineFade2 { 0%{opacity:0} 25%{opacity:1} 100%{opacity:1} }
      @keyframes lineFade3 { 0%{opacity:0} 45%{opacity:1} 100%{opacity:1} }
      @keyframes lineFade4 { 0%{opacity:0} 65%{opacity:1} 100%{opacity:1} }
      @keyframes lineFade5 { 0%{opacity:0} 80%{opacity:1} 100%{opacity:1} }
      @keyframes lineFade6 { 0%{opacity:0} 92%{opacity:1} 100%{opacity:1} }
    </style>
  </defs>

  <!-- Window Chrome -->
  <rect width="860" height="410" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="860" height="36"  rx="12" fill="#111827"/>
  <rect y="24" width="860" height="12" fill="#111827"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#ef4444"/>
  <circle cx="42" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="18" r="6" fill="#10b981"/>

  <!-- Window title -->
  <text x="430" y="23" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">
    bash — geoseg@satellite-node: ~/GEOSEG
  </text>

  <!-- Terminal Body -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11.5">
    <!-- Step 1 -->
    <g style="animation:lineFade1 10s infinite">
      <text x="25" y="65" fill="#64748b">$</text>
      <text x="40" y="65" fill="#22d3ee">git clone https://github.com/yajatkataria08-a11y/GEOSEG.git &amp;&amp; cd GEOSEG</text>
      <text x="25" y="85" fill="#10b981">✓ Cloned repository: 56 modules, 10,129 documentation lines ready</text>
    </g>

    <!-- Step 2 -->
    <g style="animation:lineFade2 10s infinite">
      <text x="25" y="115" fill="#64748b">$</text>
      <text x="40" y="115" fill="#22d3ee">python -m venv .venv &amp;&amp; source .venv/bin/activate</text>
      <text x="25" y="135" fill="#10b981">✓ Virtual environment initialized with Python 3.12 LTS</text>
    </g>

    <!-- Step 3 -->
    <g style="animation:lineFade3 10s infinite">
      <text x="25" y="165" fill="#64748b">$</text>
      <text x="40" y="165" fill="#22d3ee">pip install -r requirements.txt</text>
      <text x="25" y="185" fill="#94a3b8">  Installing: torch==2.5.0 fastapi==0.115 torchvision uvicorn GDAL ...</text>
      <text x="25" y="205" fill="#10b981">✓ Successfully installed 42 geospatial &amp; deep learning packages</text>
    </g>

    <!-- Step 4 -->
    <g style="animation:lineFade4 10s infinite">
      <text x="25" y="235" fill="#64748b">$</text>
      <text x="40" y="235" fill="#22d3ee">python -m uvicorn api.server:app --host 127.0.0.1 --port 8000</text>
      <text x="25" y="255" fill="#38bdf8">INFO:     Started server process [22300] — FastAPI 0.115</text>
      <text x="25" y="275" fill="#10b981">INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)</text>
    </g>

    <!-- Step 5 -->
    <g style="animation:lineFade5 10s infinite">
      <text x="25" y="305" fill="#64748b">$</text>
      <text x="40" y="305" fill="#22d3ee">cd frontend &amp;&amp; npm run dev</text>
      <text x="25" y="325" fill="#10b981">  VITE v5.4.21  ready in 443 ms  ➜  Local: http://127.0.0.1:5173/</text>
    </g>

    <!-- Step 6 -->
    <g style="animation:lineFade6 10s infinite">
      <text x="25" y="355" fill="#64748b">$</text>
      <text x="40" y="355" fill="#22d3ee">curl -s http://127.0.0.1:8000/api/health</text>
      <text x="25" y="375" fill="#fbbf24">{"status":"ok","gpu_available":true,"version":"0.1.0","endpoints":18}</text>
    </g>

    <!-- Blinking Cursor -->
    <rect x="525" y="362" width="8" height="15" fill="#22d3ee" style="animation:blink 1s infinite"/>
  </g>
</svg>
